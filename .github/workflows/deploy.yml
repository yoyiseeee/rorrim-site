name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /rorrim-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare slim Pages bundle
        run: |
          rm -rf /tmp/rorrim-site-pages
          mkdir -p /tmp/rorrim-site-pages
          rsync -a --delete \
            --exclude '.DS_Store' \
            --exclude '/noise/' \
            --exclude '/spaces/' \
            --exclude '/noclip/' \
            --exclude '/noclipping/ikea-mirror-catalogue/' \
            --exclude '/noclipping/axis-demo/**/*.png' \
            out/ /tmp/rorrim-site-pages/
          touch /tmp/rorrim-site-pages/.nojekyll

      - name: Normalize and verify Pages asset paths
        run: npm run pages:prepare -- /tmp/rorrim-site-pages

      - name: Enforce Pages bundle size limit
        run: |
          size_mb=$(du -sm /tmp/rorrim-site-pages | cut -f1)
          echo "Pages bundle: ${size_mb} MB"
          test "$size_mb" -lt 950

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/rorrim-site-pages
          git init
          git checkout -B gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy static site to GitHub Pages"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
