  "h": "full B-stem + n-arch (C rotated)",
  "i": "B-stem centered + top dot",
  "j": "J + dot",

  "l": "thin B-stem",
  "m": "B-stem + 2 compressed P-arcs",
  "n": "B-stem + n-arch (C rotated 90°)",
  "o": "same as O",
  "p": "same as P",
