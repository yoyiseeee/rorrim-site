      #axisLine {
        stroke: ${MIRROR_RED} !important;
        stroke-width: 8 !important;
        stroke-linecap: butt !important;
        fill: none !important;
      }

      .mirror-hit,
      .cursor-arrow {
        display: none !important;
      }

      .text-layer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
      }

      .text-content {
        width: 100%;
        max-width: 100%;
        color: #111111;
        font-family: "rorrim", sans-serif;
        font-weight: 400;
        line-height: 1.02;
        text-align: center;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        word-break: break-word;
      }
    `;
  }

  function assertNativeSvgExport(serialized) {
    const forbidden = [
      ['foreignObject', 'foreignObject is not allowed in native SVG export.'],
      ['<object', 'Embedded object/PDF is not allowed in native SVG export.'],
      ['blob:', 'Blob URLs are not stable for print export. Please wait for image embedding to finish.'],
      ['file://', 'File URLs are not stable for print export.'],
    ];
    const hit = forbidden.find(([needle]) => serialized.includes(needle));
    if (hit) throw new Error(hit[1]);
  }

  async function buildExportSvgDocument() {
    await uploadedAsset.dataReady;
    if (uploadedAsset.kind === 'image' && uploadedAsset.image && uploadedAsset.image.decode) {
      await uploadedAsset.image.decode().catch(() => {});
    }
    render();
    if (uploadedAsset.kind === 'pdf') {
      throw new Error('PDF assets cannot be embedded in native SVG/PNG export in Safari. Convert the PDF page to PNG/JPG first, then upload that image.');
    }
    if (uploadedAsset.kind === 'image' && !uploadedAsset.dataUrl) {
      throw new Error('Image data is not ready yet. Try exporting again in one moment.');
    }
    const clone = stage.cloneNode(true);
    clone.removeAttribute('id');
    clone.removeAttribute('tabindex');
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    clone.setAttribute('viewBox', exportViewBox());
    clone.setAttribute('preserveAspectRatio', 'xMidYMid slice');
    clone.querySelectorAll('.mirror-hit, .cursor-arrow').forEach((node) => node.remove());
    clone.querySelectorAll('.mirror-axis, #axisLine').forEach((node) => {
      node.setAttribute('stroke', MIRROR_RED);
      node.setAttribute('stroke-width', '8');
      node.setAttribute('stroke-linecap', 'butt');
      node.setAttribute('fill', 'none');
      node.style.stroke = MIRROR_RED;
      node.style.strokeWidth = '8';
      node.style.strokeLinecap = 'butt';
      node.style.fill = 'none';
    });

    const defs = clone.querySelector('defs') || clone.insertBefore(
      document.createElementNS('http://www.w3.org/2000/svg', 'defs'),
      clone.firstChild
    );
    const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
    style.textContent = exportCloneStyles();
    defs.insertBefore(style, defs.firstChild);
    assertNativeSvgExport(new XMLSerializer().serializeToString(clone));
    return clone;
  }

  async function prepareExportClone() {
    return buildExportSvgDocument();
  }

  async function openExportPreview() {
    applyExportPageSize();
    try {
      const clone = await buildExportSvgDocument();
      exportPreviewSurface.replaceChildren(clone);
      exportPreviewOverlay.classList.add('is-open');
      exportPreviewOverlay.setAttribute('aria-hidden', 'false');
      setStatus(exportPageSize.value === 'screen'
        ? 'Previewing browser default PDF export.'
        : 'Previewing strict 60mm x 30mm / 2:1 PDF export.');
    } catch (error) {
      setStatus(`Preview failed: ${error.message}`);
    }
  }

  function closeExportPreview() {
    exportPreviewOverlay.classList.remove('is-open');
    exportPreviewOverlay.setAttribute('aria-hidden', 'true');
    exportPreviewSurface.replaceChildren();
  }

  function canvasToBlob(canvas, type = 'image/png', quality) {
    return new Promise((resolve) => {
      canvas.toBlob((blob) => resolve(blob), type, quality);
    });
  }

  function stripMaterialImagesForRasterClone(clone) {
    clone.querySelectorAll('.material-layer').forEach((node) => node.remove());
  }

  function parsedExportViewBox() {
    const parts = exportViewBox().split(/\s+/).map(Number);
    return { x: parts[0], y: parts[1], width: parts[2], height: parts[3] };
  }

  function applyExportCanvasView(context, width, height) {
    const viewBox = parsedExportViewBox();
    context.scale(width / viewBox.width, height / viewBox.height);
    context.translate(-viewBox.x, -viewBox.y);
  }

  function applyCanvasHalfPlaneClip(context, sign) {
    const points = polygonPointsForHalfPlane(sign, mirror.cx, mirror.cy, mirror.angle, 0);
    context.beginPath();
    points.forEach(([x, y], index) => {
      if (index === 0) context.moveTo(x, y);
      else context.lineTo(x, y);
    });
    context.closePath();
    context.clip();
  }

  function applyCanvasReflection(context) {
    const matrix = matrixForReflection();
    context.transform(matrix.a, matrix.b, matrix.c, matrix.d, matrix.e, matrix.f);
  }

  function drawUploadedAssetOnExportCanvas(context) {
    if (uploadedAsset.kind !== 'image' || !uploadedAsset.image) return;
    const x = -uploadedAsset.width / 2;
    const y = -uploadedAsset.height / 2;
    context.save();
    context.translate(uploadedAsset.x, uploadedAsset.y);
    context.rotate(uploadedAsset.rotation * Math.PI / 180);
    context.scale(uploadedAsset.scale, uploadedAsset.scale);
    context.imageSmoothingEnabled = true;
    context.imageSmoothingQuality = 'high';
    context.drawImage(uploadedAsset.image, x, y, uploadedAsset.width, uploadedAsset.height);
    context.restore();
  }

  function drawUploadedAssetPairOnExportCanvas(context) {
    if (uploadedAsset.kind !== 'image' || !uploadedAsset.image) return;

    context.save();
    applyCanvasHalfPlaneClip(context, -1);
    drawUploadedAssetOnExportCanvas(context);
    context.restore();

    if (spatial.mode !== 'slice') {
      context.save();
      applyCanvasHalfPlaneClip(context, 1);
      applyCanvasReflection(context);
      drawUploadedAssetOnExportCanvas(context);
      context.restore();
    }
  }

  async function renderExportSvgToCanvas(width, height, options = {}) {
    const clone = await buildExportSvgDocument();
    if (options.omitMaterialImages) stripMaterialImagesForRasterClone(clone);
    return new Promise((resolve, reject) => {
      clone.setAttribute('width', width);
      clone.setAttribute('height', height);
      const serialized = new XMLSerializer().serializeToString(clone);
      try {
        assertNativeSvgExport(serialized);
      } catch (error) {
        reject(error);
        return;
      }
      const svgBlob = new Blob([serialized], { type: 'image/svg+xml;charset=utf-8' });
      const svgUrl = URL.createObjectURL(svgBlob);
      const image = new Image();
      image.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d');
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, width, height);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        if (options.drawMaterialImagesManually) {
          context.save();
          applyExportCanvasView(context, width, height);
          drawUploadedAssetPairOnExportCanvas(context);
          context.restore();
        }
        context.drawImage(image, 0, 0, width, height);
        URL.revokeObjectURL(svgUrl);
        resolve(canvas);
      };
      image.onerror = () => {
        URL.revokeObjectURL(svgUrl);
        reject(new Error('Safari could not render the SVG preview for download.'));
      };
      image.src = svgUrl;
    });
  }

  async function exportCurrentViewAsSvg() {
    try {
      const clone = await buildExportSvgDocument();
      clone.setAttribute('width', '60mm');
      clone.setAttribute('height', '30mm');
      const serialized = new XMLSerializer().serializeToString(clone);
      const blob = new Blob([
        '<?xml version="1.0" encoding="UTF-8"?>\n',
        serialized,
      ], { type: 'image/svg+xml;charset=utf-8' });
      downloadBlob(blob, 'Mirror-Alphabet-60x30mm-vector.svg');
      setStatus('Downloaded vector SVG from the exact preview source.');
    } catch (error) {
      setStatus(`SVG export failed: ${error.message}`);
    }
  }

  function applyExportPageSize() {
    let style = document.getElementById('exportPageStyle');
    if (!style) {
      style = document.createElement('style');
      style.id = 'exportPageStyle';
      document.head.appendChild(style);
    }

    if (exportPageSize.value === 'book-spread-60x30') {
      style.textContent = `
        @media print {
          @page {
            size: 60mm 30mm;
            margin: 0;
          }

          html,
          body,
          main,
          svg#stage {
            width: 60mm !important;
            height: 30mm !important;
            min-width: 60mm !important;
            min-height: 30mm !important;
            max-width: 60mm !important;
            max-height: 30mm !important;
          }
        }
      `;
      setStatus('Exporting PDF at 60mm x 30mm / 2:1.');
      return;
    }

    style.textContent = `
      @media print {
        @page {
          size: landscape;
          margin: 0;
        }
      }
    `;
    setStatus('Exporting PDF at browser landscape size.');
  }

  function downloadBlob(blob, fileName) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function crc32(bytes) {
    let crc = -1;
    for (let index = 0; index < bytes.length; index += 1) {
      crc ^= bytes[index];
      for (let bit = 0; bit < 8; bit += 1) {
        crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
      }
    }
    return (crc ^ -1) >>> 0;
  }

  function uint32Bytes(value) {
    return [
      (value >>> 24) & 255,
      (value >>> 16) & 255,
      (value >>> 8) & 255,
      value & 255,
    ];
  }

  function pngChunk(type, data) {
    const typeBytes = Array.from(type).map((char) => char.charCodeAt(0));
    const body = new Uint8Array(typeBytes.length + data.length);
    body.set(typeBytes, 0);
    body.set(data, typeBytes.length);
    const chunk = new Uint8Array(12 + data.length);
    chunk.set(uint32Bytes(data.length), 0);
    chunk.set(typeBytes, 4);
    chunk.set(data, 8);
    chunk.set(uint32Bytes(crc32(body)), 8 + data.length);
    return chunk;
  }

  function pngBlobWithDpi(arrayBuffer, dpi) {
    const source = new Uint8Array(arrayBuffer);
    const pixelsPerMeter = Math.round(dpi / 0.0254);
    const data = new Uint8Array(9);
    data.set(uint32Bytes(pixelsPerMeter), 0);
    data.set(uint32Bytes(pixelsPerMeter), 4);
    data[8] = 1;
    const physicalSizeChunk = pngChunk('pHYs', data);
    const insertAfterIhdr = 33;
    return new Blob([
      source.slice(0, insertAfterIhdr),
      physicalSizeChunk,
      source.slice(insertAfterIhdr),
    ], { type: 'image/png' });
  }

  function concatBytes(chunks) {
    const encoder = new TextEncoder();
    const encoded = chunks.map((chunk) => (
      typeof chunk === 'string' ? encoder.encode(chunk) : chunk
    ));
    const total = encoded.reduce((sum, chunk) => sum + chunk.length, 0);
    const output = new Uint8Array(total);
    let offset = 0;
    encoded.forEach((chunk) => {
      output.set(chunk, offset);
      offset += chunk.length;
    });
    return output;
  }

  function pdfNumber(value) {
    return Number(value.toFixed(4)).toString();
  }

  function pdfRgb(hex) {
    const clean = hex.replace('#', '');
    return [
      parseInt(clean.slice(0, 2), 16) / 255,
      parseInt(clean.slice(2, 4), 16) / 255,
      parseInt(clean.slice(4, 6), 16) / 255,
    ].map(pdfNumber).join(' ');
  }

  function pdfPolygonClip(points) {
    return `${points.map(([x, y], index) => (
      `${pdfNumber(x)} ${pdfNumber(y)} ${index === 0 ? 'm' : 'l'}`
    )).join('\n')}\nh\nW n\n`;
  }

  function pdfReflectionMatrix() {
    const matrix = matrixForReflection();
    return `${pdfNumber(matrix.a)} ${pdfNumber(matrix.b)} ${pdfNumber(matrix.c)} ${pdfNumber(matrix.d)} ${pdfNumber(matrix.e)} ${pdfNumber(matrix.f)} cm\n`;
  }

  function tokenizePathData(path) {
    return path.match(/[a-zA-Z]|[-+]?(?:\d*\.)?\d+(?:e[-+]?\d+)?/g) || [];
  }

  function glyphPathToPdf(path, originX, baselineY, scale) {
    const tokens = tokenizePathData(path);
    let index = 0;
    let command = '';
    let currentX = 0;
    let currentY = 0;
    let startedWithMove = false;
    const out = [];
    const isCommand = (token) => /^[a-zA-Z]$/.test(token);
    const point = (x, y) => [
      originX + x * scale,
      baselineY - y * scale,
    ];

    while (index < tokens.length) {
      if (isCommand(tokens[index])) {
        command = tokens[index++];
        startedWithMove = false;
      }

      if (command === 'M' || command === 'm') {
        if (index + 1 >= tokens.length) break;
        const x = Number(tokens[index++]);
        const y = Number(tokens[index++]);
        const [px, py] = point(x, y);
        out.push(`${pdfNumber(px)} ${pdfNumber(py)} ${startedWithMove ? 'l' : 'm'}`);
        currentX = x;
        currentY = y;
        startedWithMove = true;
        command = 'L';
      } else if (command === 'L' || command === 'l') {
        if (index + 1 >= tokens.length || isCommand(tokens[index])) continue;
        const x = Number(tokens[index++]);
        const y = Number(tokens[index++]);
        const [px, py] = point(x, y);
        out.push(`${pdfNumber(px)} ${pdfNumber(py)} l`);
        currentX = x;
        currentY = y;
      } else if (command === 'H' || command === 'h') {
        if (index >= tokens.length || isCommand(tokens[index])) continue;
        const x = Number(tokens[index++]);
        const [px, py] = point(x, currentY);
        out.push(`${pdfNumber(px)} ${pdfNumber(py)} l`);
        currentX = x;
      } else if (command === 'V' || command === 'v') {
        if (index >= tokens.length || isCommand(tokens[index])) continue;
        const y = Number(tokens[index++]);
        const [px, py] = point(currentX, y);
        out.push(`${pdfNumber(px)} ${pdfNumber(py)} l`);
        currentY = y;
      } else if (command === 'C' || command === 'c') {
        if (index + 5 >= tokens.length || isCommand(tokens[index])) continue;
        const x1 = Number(tokens[index++]);
        const y1 = Number(tokens[index++]);
        const x2 = Number(tokens[index++]);
        const y2 = Number(tokens[index++]);
        const x = Number(tokens[index++]);
        const y = Number(tokens[index++]);
        const p1 = point(x1, y1);
        const p2 = point(x2, y2);
        const p = point(x, y);
        out.push(`${pdfNumber(p1[0])} ${pdfNumber(p1[1])} ${pdfNumber(p2[0])} ${pdfNumber(p2[1])} ${pdfNumber(p[0])} ${pdfNumber(p[1])} c`);
        currentX = x;
        currentY = y;
      } else if (command === 'Q' || command === 'q') {
        if (index + 3 >= tokens.length || isCommand(tokens[index])) continue;
        const x1 = Number(tokens[index++]);
        const y1 = Number(tokens[index++]);
        const x = Number(tokens[index++]);
        const y = Number(tokens[index++]);
        const c1x = currentX + (2 / 3) * (x1 - currentX);
        const c1y = currentY + (2 / 3) * (y1 - currentY);
        const c2x = x + (2 / 3) * (x1 - x);
        const c2y = y + (2 / 3) * (y1 - y);
        const p1 = point(c1x, c1y);
        const p2 = point(c2x, c2y);
        const p = point(x, y);
        out.push(`${pdfNumber(p1[0])} ${pdfNumber(p1[1])} ${pdfNumber(p2[0])} ${pdfNumber(p2[1])} ${pdfNumber(p[0])} ${pdfNumber(p[1])} c`);
        currentX = x;
        currentY = y;
      } else if (command === 'Z' || command === 'z') {
        out.push('h');
        command = '';
      } else {
        index += 1;
      }
    }

    return out.join('\n');
  }

  function fontOutline(family, char) {
    const fonts = window.MirrorFontOutlines || {};
    const font = fonts[family] || fonts[RORRIM_FONT_FAMILY];
    if (!font) return null;
    return {
      font,
      glyph: font.glyphs[char] || font.glyphs['?'] || font.glyphs[' '],
    };
  }

  function textLineGlyphRuns() {
    const now = Date.now();
    return svgTextLines().map((line) => line.map(({ char, index }) => ({
      char,
      family: fontFamilyForAge(textCharTimes[index] || now, now),
    })));
  }

  function glyphAdvance(run, size) {
    const outline = fontOutline(run.family, run.char);
    if (!outline || !outline.glyph) return size * 0.5;
    return outline.glyph.advance * size / outline.font.unitsPerEm;
  }

  function pdfGlyphPath(run, x, centerY, size) {
    const outline = fontOutline(run.family, run.char);
    if (!outline || !outline.glyph || !outline.glyph.path) return '';
    const scale = size / outline.font.unitsPerEm;
    const baselineY = centerY + ((outline.font.ascender + outline.font.descender) / 2) * scale;
    return `${glyphPathToPdf(outline.glyph.path, x, baselineY, scale)}\nf\n`;
  }

  function pdfTextPaths() {
    let content = '0 0 0 rg\n';
    if (mode === 'single') {
      const run = {
        char: GLYPH.char,
        family: fontFamilyForAge(GLYPH.changedAt),
      };
      const advance = glyphAdvance(run, GLYPH.size);
      content += `q\n${pdfNumber(Math.cos(GLYPH.rotation * Math.PI / 180) * GLYPH.mirrorX)} ${pdfNumber(Math.sin(GLYPH.rotation * Math.PI / 180) * GLYPH.mirrorX)} ${pdfNumber(-Math.sin(GLYPH.rotation * Math.PI / 180) * GLYPH.mirrorY)} ${pdfNumber(Math.cos(GLYPH.rotation * Math.PI / 180) * GLYPH.mirrorY)} ${pdfNumber(GLYPH.x)} ${pdfNumber(GLYPH.y)} cm\n`;
      content += pdfGlyphPath(run, -advance / 2, 0, GLYPH.size);
      content += 'Q\n';
      return content;
    }

    if (mode !== 'text') return '';
    const lines = textLineGlyphRuns();
    const lineHeight = textSize * 1.02;
    const startY = STAGE.height / 2 - (lines.length - 1) * lineHeight / 2;
    lines.forEach((line, lineIndex) => {
      const width = line.reduce((sum, run) => sum + glyphAdvance(run, textSize), 0);
      let cursor = STAGE.width / 2 - width / 2;
      const centerY = startY + lineIndex * lineHeight;
      line.forEach((run) => {
        content += pdfGlyphPath(run, cursor, centerY, textSize);
        cursor += glyphAdvance(run, textSize);
      });
    });
    return content;
  }

  function pdfAssetCommands(imageName) {
    if (!imageName || uploadedAsset.kind !== 'image' || !uploadedAsset.image) return '';
    const angle = uploadedAsset.rotation * Math.PI / 180;
    const cos = Math.cos(angle) * uploadedAsset.scale;
    const sin = Math.sin(angle) * uploadedAsset.scale;
    const x = -uploadedAsset.width / 2;
    const y = -uploadedAsset.height / 2;
    return `q\n${pdfNumber(cos)} ${pdfNumber(sin)} ${pdfNumber(-sin)} ${pdfNumber(cos)} ${pdfNumber(uploadedAsset.x)} ${pdfNumber(uploadedAsset.y)} cm\n${pdfNumber(uploadedAsset.width)} 0 0 ${pdfNumber(uploadedAsset.height)} ${pdfNumber(x)} ${pdfNumber(y)} cm\n/${imageName} Do\nQ\n`;
  }

  function pdfSceneContent(imageName) {
    const viewBox = parsedExportViewBox();
    const pageWidth = 60 / 25.4 * 72;
    const pageHeight = 30 / 25.4 * 72;
    const scale = pageWidth / viewBox.width;
    const red = pdfRgb(MIRROR_RED);
    const { ax, ay, bx, by } = lineEndpoints();
    let content = `q\n${pdfNumber(scale)} 0 0 ${pdfNumber(-scale)} ${pdfNumber(-viewBox.x * scale)} ${pdfNumber(pageHeight + viewBox.y * scale)} cm\n`;
    content += `1 1 1 rg\n${pdfNumber(viewBox.x)} ${pdfNumber(viewBox.y)} ${pdfNumber(viewBox.width)} ${pdfNumber(viewBox.height)} re f\n`;

    content += `q\n${pdfPolygonClip(polygonPointsForHalfPlane(1, mirror.cx, mirror.cy, mirror.angle, 0))}${pdfReflectionMatrix()}${pdfAssetCommands(imageName)}${pdfTextPaths()}Q\n`;
    content += `q\n${pdfPolygonClip(polygonPointsForHalfPlane(-1, mirror.cx, mirror.cy, mirror.angle, 0))}${pdfAssetCommands(imageName)}${pdfTextPaths()}Q\n`;
    content += `${red} RG\n8 w\n0 J\n${pdfNumber(ax)} ${pdfNumber(ay)} m\n${pdfNumber(bx)} ${pdfNumber(by)} l\nS\n`;
    content += 'Q\n';
    return { content, pageWidth, pageHeight };
  }

  async function pdfImageResource() {
    if (uploadedAsset.kind !== 'image' || !uploadedAsset.image) return null;
    if (uploadedAsset.image.decode) await uploadedAsset.image.decode().catch(() => {});
    const canvas = document.createElement('canvas');
    canvas.width = uploadedAsset.image.naturalWidth || uploadedAsset.image.width;
    canvas.height = uploadedAsset.image.naturalHeight || uploadedAsset.image.height;
    const context = canvas.getContext('2d');
    context.fillStyle = '#ffffff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(uploadedAsset.image, 0, 0);
    const blob = await canvasToBlob(canvas, 'image/jpeg', 0.98);
    return {
      name: 'Im0',
      width: canvas.width,
      height: canvas.height,
      bytes: new Uint8Array(await blob.arrayBuffer()),
    };
  }

  function buildVectorPdf(content, pageWidth, pageHeight, imageResource) {
    const objects = [];
    const addObject = (body) => {
      objects.push(body);
      return objects.length;
    };

    const catalogId = addObject('<< /Type /Catalog /Pages 2 0 R >>');
    const pagesId = addObject('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    let imageId = null;
    if (imageResource) {
      imageId = addObject([
        `<< /Type /XObject /Subtype /Image /Width ${imageResource.width} /Height ${imageResource.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imageResource.bytes.length} >>\nstream\n`,
        imageResource.bytes,
        '\nendstream',
      ]);
    }
    const resources = imageResource ? `/XObject << /${imageResource.name} ${imageId} 0 R >>` : '';
    const pageId = addObject(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pdfNumber(pageWidth)} ${pdfNumber(pageHeight)}] /Resources << ${resources} >> /Contents ${objects.length + 2} 0 R >>`);
    const contentId = addObject(`<< /Length ${new TextEncoder().encode(content).length} >>\nstream\n${content}endstream`);

    objects[catalogId - 1] = `<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
    objects[pagesId - 1] = `<< /Type /Pages /Kids [${pageId} 0 R] /Count 1 >>`;
    objects[pageId - 1] = `<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${pdfNumber(pageWidth)} ${pdfNumber(pageHeight)}] /Resources << ${resources} >> /Contents ${contentId} 0 R >>`;

    const chunks = ['%PDF-1.4\n'];
    const offsets = [0];
    let byteOffset = concatBytes(chunks).length;
    objects.forEach((object, index) => {
      offsets.push(byteOffset);
      const objectChunks = [`${index + 1} 0 obj\n`];
      if (Array.isArray(object)) objectChunks.push(...object);
      else objectChunks.push(object);
      objectChunks.push('\nendobj\n');
      const bytes = concatBytes(objectChunks);
      chunks.push(bytes);
      byteOffset += bytes.length;
    });
    const xrefOffset = byteOffset;
    const rows = offsets.map((offset, index) => (
      index === 0 ? '0000000000 65535 f \n' : `${String(offset).padStart(10, '0')} 00000 n \n`
    )).join('');
    chunks.push(`xref\n0 ${objects.length + 1}\n${rows}trailer\n<< /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`);
    return new Blob([concatBytes(chunks)], { type: 'application/pdf' });
  }

  async function exportCurrentViewAsPng() {
    setStatus('Rendering print PNG from native SVG source at 8x...');
    try {
      const canvas = await renderExportSvgToCanvas(EXPORT_PRINT_PNG.width, EXPORT_PRINT_PNG.height, {
        omitMaterialImages: true,
        drawMaterialImagesManually: true,
      });
      const blob = await canvasToBlob(canvas, 'image/png');
      if (!blob) throw new Error('empty PNG blob');
      const buffer = await blob.arrayBuffer();
      const dpiBlob = pngBlobWithDpi(buffer, EXPORT_PRINT_PNG.dpi);
      downloadBlob(dpiBlob, 'Mirror-Alphabet-60x30mm-native-8x.png');
      setStatus(`Downloaded native SVG raster PNG: ${EXPORT_PRINT_PNG.width} x ${EXPORT_PRINT_PNG.height}px, tagged ${EXPORT_PRINT_PNG.dpi}dpi for 60mm x 30mm.`);
    } catch (error) {
      setStatus(`PNG export failed: ${error.message}`);
    }
  }

  async function downloadCurrentViewAsPdf() {
    setStatus('Building vector PDF...');
    try {
      await uploadedAsset.dataReady;
      const imageResource = await pdfImageResource();
      const scene = pdfSceneContent(imageResource ? imageResource.name : null);
      const pdfBlob = buildVectorPdf(scene.content, scene.pageWidth, scene.pageHeight, imageResource);
      downloadBlob(pdfBlob, 'Mirror-Alphabet-60x30mm-vector.pdf');
      closeExportPreview();
      setStatus(`Downloaded vector PDF. Red line: ${MIRROR_RED}.`);
    } catch (error) {
      setStatus(`Vector PDF export failed: ${error.message}`);
    }
  }

  function setStatus(message) {
    const status = document.getElementById('searchStatus');
    if (status) status.textContent = message;
  }

  exportPdfButton.addEventListener('click', exportCurrentViewAsPdf);
  exportPngButton.addEventListener('click', exportCurrentViewAsPng);
  exportVectorSvgButton.addEventListener('click', exportCurrentViewAsSvg);
  confirmExportPdfButton.addEventListener('click', downloadCurrentViewAsPdf);
  cancelExportPreviewButton.addEventListener('click', closeExportPreview);
  assetInput.addEventListener('change', () => setUploadedAssetFromFile(assetInput.files[0]));
  clearAssetButton.addEventListener('click', clearUploadedAsset);
  [assetScaleInput, assetRotationInput, assetXInput, assetYInput].forEach((input) => {
    input.addEventListener('input', applyAssetControlValues);
  });
  textInput.value = DEFAULT_TEXT;
  updateAssetControls();

  window.addEventListener('keydown', (event) => {
    const usesCommand = event.metaKey || event.ctrlKey;
    if (!usesCommand) return;

    // Cmd+/- : adjust text size globally, regardless of focus
    if (!event.shiftKey && (event.key === '=' || event.key === '+' || event.key === '-' || event.key === '_')) {
      event.preventDefault();
      if (event.key === '-' || event.key === '_') {
        textSize = Math.max(24, textSize - 8);
      } else {
        textSize = textSize + 8;
      }
      render();
      return;
    }

    if (!event.shiftKey) return;

    const key = event.key.toLowerCase();
    if (key === 'a') {
      event.preventDefault();
      toggleAutoPanel();
    } else if (key === 'e') {
      event.preventDefault();
      exportCurrentViewAsPdf();
    }
  });

  function wait(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function openingTypingDelays(text, totalMs) {
    const chars = Array.from(text);
    const weights = chars.map((char) => {
      let weight = 1 + (Math.random() - 0.5) * OPENING_SETTINGS.typingRandomness * 2;
      if (char === '\n') weight += 2.2 + Math.random() * 0.7;
      if (char === ' ') weight += 0.4 + Math.random() * 0.5;
      if (Math.random() < 0.12) weight *= 0.45;
      return Math.max(0.25, weight);
    });
    const totalWeight = weights.reduce((sum, weight) => sum + weight, 0) || 1;
    return weights.map((weight) => (weight / totalWeight) * totalMs);
  }

  function openingBaseFontPx() {
    return Math.min(window.innerWidth * 0.0372, window.innerHeight * 0.141);
  }

  function measureOpeningLineWidth(line, fontFamily, fontSize) {
    if (!measureOpeningLineWidth.canvas) {
      measureOpeningLineWidth.canvas = document.createElement('canvas');
      measureOpeningLineWidth.context = measureOpeningLineWidth.canvas.getContext('2d');
    }
    const context = measureOpeningLineWidth.context;
    context.font = `400 ${fontSize}px "${fontFamily}", sans-serif`;
    return context.measureText(line).width;
  }

  function widestOpeningLineWidth(lines, fontFamilies, fontSize) {
    return lines.reduce((widest, line) => {
      return Math.max(
        widest,
        ...fontFamilies.map((fontFamily) => measureOpeningLineWidth(line, fontFamily, fontSize))
      );
    }, 0);
  }

  function fitOpeningTypography(text, fontFamily, scale, lineHeight, fillHeight = false) {
    const lines = text.split('\n');
    const fontFamilies = Array.isArray(fontFamily) ? fontFamily : [fontFamily];
    const styles = window.getComputedStyle(openingTextBox);
    const availableWidth = openingTextBox.clientWidth -
      parseFloat(styles.paddingLeft) -
      parseFloat(styles.paddingRight);
    const availableHeight = openingTextBox.clientHeight -
      parseFloat(styles.paddingTop) -
      parseFloat(styles.paddingBottom) -
      (fillHeight ? 20 : 0);
    const targetSize = openingBaseFontPx() * scale;
    const widestLine = widestOpeningLineWidth(lines, fontFamilies, targetSize);
    const textHeight = targetSize + Math.max(0, lines.length - 1) * targetSize * lineHeight;
    const widthRatio = widestLine > 0 ? availableWidth / widestLine : 1;
    const heightRatio = textHeight > 0 ? availableHeight / textHeight : 1;
    const fitRatio = fillHeight ? heightRatio : Math.min(1, widthRatio, heightRatio);
    const fittedSize = targetSize * fitRatio * (fillHeight ? 0.8 : 1);
    openingTextBox.style.setProperty('--opening-font-size', `${Math.max(12, fittedSize)}px`);
    openingTextBox.style.setProperty('--opening-line-height', String(lineHeight));
  }

  function setOpeningAlignment(align = 'center') {
    openingTextBox.style.textAlign = align;
    openingTextBox.style.justifyContent = align === 'right' ? 'flex-end' : 'center';
  }

  function renderOpeningPlainText(value, fontFamily, scale = 1, lineHeight = 1.04, fitText = OPENING_ALPHABET_TEXT, align = 'center') {
    fitOpeningTypography(fitText, fontFamily, scale, lineHeight);
    setOpeningAlignment(align);
    openingTextBox.style.fontFamily = `"${fontFamily}", sans-serif`;
    openingTextBox.textContent = value;
  }

  function renderOpeningMaturedText(value, charTimes, scale = 1, lineHeight = 1.04, fitText = OPENING_ALPHABET_TEXT, align = 'center', fillHeight = false) {
    const now = Date.now();
    fitOpeningTypography(fitText, [ANTIQUE_FONT_FAMILY, RORRIM_FONT_FAMILY], scale, lineHeight, fillHeight);
    setOpeningAlignment(align);
    openingTextBox.style.fontFamily = 'inherit';
    openingTextBox.innerHTML = Array.from(value).map((char, index) => {
      if (char === '\n') return '<br>';
      const fontFamily = fontFamilyForAge(charTimes[index] || now, now);
      return `<span style="font-family:'${escapeAttribute(fontFamily)}', sans-serif">${escapeHtml(char)}</span>`;
    }).join('');
  }

  async function typeOpeningPlainText(text, fontFamily, durationMs, scale = 1, lineHeight = 1.04, align = 'center') {
    const chars = Array.from(text);
    const delays = openingTypingDelays(text, durationMs);
    let value = '';
    renderOpeningPlainText(value, fontFamily, scale, lineHeight, text, align);
    for (let index = 0; index < chars.length; index++) {
      value += chars[index];
      renderOpeningPlainText(value, fontFamily, scale, lineHeight, text, align);
      await wait(delays[index]);
    }
    await wait(OPENING_SETTINGS.holdMs);
    await deleteOpeningPlainText(value, fontFamily, scale, lineHeight, align);
  }

  async function deleteOpeningPlainText(text, fontFamily, scale = 1, lineHeight = 1.04, align = 'center') {
    let value = text;
    const chars = Array.from(text);
    const baseDelay = 3000 / Math.max(1, chars.length);
    let step = 0;
    while (value.length > 0) {
      value = Array.from(value).slice(0, -1).join('');
      renderOpeningPlainText(value, fontFamily, scale, lineHeight, text, align);
      const progress = step / Math.max(1, chars.length - 1);
      await wait(baseDelay * (1.75 - progress * 1.35));
      step += 1;
    }
  }

  async function typeOpeningMaturedText(text, durationMs, scale = 1, lineHeight = 1.04, align = 'center', fitText = text, fillHeight = false) {
    const chars = Array.from(text);
    const delays = openingTypingDelays(text, durationMs);
    const charTimes = [];
    let value = '';
    renderOpeningMaturedText(value, charTimes, scale, lineHeight, fitText, align, fillHeight);
    for (let index = 0; index < chars.length; index++) {
      value += chars[index];
      charTimes.push(Date.now());
      renderOpeningMaturedText(value, charTimes, scale, lineHeight, fitText, align, fillHeight);
      await wait(delays[index]);
    }

    const lastCharTime = charTimes[charTimes.length - 1] || Date.now();
    while (Date.now() - lastCharTime < FONT_MATURATION_MS) {
      await wait(OPENING_SETTINGS.transitionRenderMs);
      renderOpeningMaturedText(value, charTimes, scale, lineHeight, fitText, align, fillHeight);
    }
    renderOpeningMaturedText(value, charTimes, scale, lineHeight, fitText, align, fillHeight);
    await wait(OPENING_SETTINGS.holdMs);
  }

  async function deleteOpeningText(text) {
    let value = text;
    while (value.length > 0) {
      value = Array.from(value).slice(0, -1).join('');
      renderOpeningMaturedText(
        value,
        Array.from(value, () => Date.now() - FONT_MATURATION_MS),
        OPENING_SETTINGS.thirdFontScale,
        OPENING_SETTINGS.thirdLineHeight,
        text,
        'right'
      );
      await wait(42 + Math.random() * 55);
    }
    openingTextBox.textContent = '';
    await wait(OPENING_SETTINGS.holdMs);
  }

  function resetOpeningStateForGame() {
    stopAutoText();
    cancelMirrorJoy();
    openingActive = false;
    initTutorial();
  }

  async function runOpeningSequence() {
    const splash = document.getElementById('splashScreen');
    if (!OPENING_SETTINGS.enabled) {
      splash.style.display = 'none';
      resetOpeningStateForGame();
      return;
    }

    await document.fonts.ready;
    await typeOpeningPlainText(
      OPENING_ALPHABET_TEXT,
      ANTIQUE_FONT_FAMILY,
      OPENING_SETTINGS.firstTypingMs,
      OPENING_SETTINGS.firstFontScale,
      OPENING_SETTINGS.firstLineHeight
    );
    await typeOpeningMaturedText(
      OPENING_ALPHABET_TEXT,
      OPENING_SETTINGS.thirdTypingMs,
      OPENING_SETTINGS.thirdFontScale,
      OPENING_SETTINGS.thirdLineHeight,
      'right',
      OPENING_TURN_TEXT,
      true
    );
    await typeOpeningMaturedText(
      OPENING_TURN_TEXT,
      Math.min(1800, OPENING_SETTINGS.thirdTypingMs),
      OPENING_SETTINGS.thirdFontScale,
      OPENING_SETTINGS.thirdLineHeight,
      'right'
    );
    await deleteOpeningText(OPENING_TURN_TEXT);

    resetOpeningStateForGame();
    splash.style.transitionDuration = `${OPENING_SETTINGS.fadeOutMs}ms`;
    splash.classList.add('splash-out');
    await wait(OPENING_SETTINGS.fadeOutMs + 40);
    splash.style.display = 'none';
  }

  window.MirrorAlphabetApp = {
    stage,
    STAGE,
    GLYPH,
    mirror,
    spatial,
    uploadedAsset,
    axisLine,
    axisHit,
    originalWrap,
    reflectionWrap,
    analysisLayer,
    render,
    applyModeFocus,
    toggleMode,
    toggleSpatialMode,
    lineEndpoints,
    matrixForReflection,
    polygonPointsForHalfPlane,
    escapeHtml,
    exportCurrentViewAsPdf,
    setExternalRenderHook(fn) {
      externalRenderHook = fn;
    },
    // Q&A controls (accessible from browser console or parent frame)
    getQaEnabled() { return qaEnabled; },
    setQaEnabled(v) {
      qaEnabled = Boolean(v);
      const overlay = document.getElementById('qaOverlay');
      const hint = document.getElementById('qaHint');
      if (!qaEnabled) {
        overlay.classList.add('qa-disabled');
        hint.classList.add('qa-disabled');
        qaChoicesEl.classList.add('qa-disabled');
      } else {
        overlay.classList.remove('qa-disabled');
        hint.classList.add('qa-disabled');
        renderAlphabetInputPrompt();
        applyModeFocus();
      }
    },
    getQaIndex() { return currentPromptIndex; },
    setQaIndex(i) {
      const index = ((i % ALPHABET_INPUT_PROMPTS.length) + ALPHABET_INPUT_PROMPTS.length) % ALPHABET_INPUT_PROMPTS.length;
      currentPromptIndex = index;
      renderAlphabetInputPrompt();
    },
  };

  render();
  runOpeningSequence();
</script>
<script src="./mirror-search.js"></script>
