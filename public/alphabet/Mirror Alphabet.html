<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror Alphabet</title>
<style>
  :root {
    --mirror-font-stack: "Antique-Olive-Std-Roman_3869", sans-serif;
    --glyph-font-stack: "rorrim", sans-serif;
  }

  @font-face {
    font-family: "Antique-Olive-Std-Roman_3869";
    src: url("./fonts/Antique-Olive%20Regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }

  @font-face {
    font-family: "rorrim";
    src: url("./fonts/rorrim-Regular.otf") format("opentype");
    font-weight: 400;
    font-style: normal;
  }

  @font-face {
    font-family: "FZFWZhuZGDSHJW";
    src: url("../fonts/FZFWZhuZGDSHJW.TTF") format("truetype");
    font-weight: 400;
    font-style: normal;
  }

  @font-face {
    font-family: "AkzidenzGrotesk";
    src: url("../fonts/AkzidenzGrotesk-Medium.otf") format("opentype");
    font-weight: 500;
    font-style: normal;
  }

  * { box-sizing: border-box; }

  html,
  body,
  main,
  svg,
  svg * {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    color-adjust: exact;
  }

  html, body {
    margin: 0;
    background: #ffffff;
    height: 100%;
    overflow: hidden;
    font-family: var(--mirror-font-stack);
    -webkit-user-select: none;
    user-select: none;
    cursor: none;
  }

  main {
    width: 100vw;
    height: 100vh;
    background: #ffffff;
    cursor: none;
    position: relative;
  }

  svg {
    width: 100vw;
    height: 100vh;
    display: block;
    background: #ffffff;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    outline: none;
    cursor: none;
  }

  .mirror-axis {
    stroke: #fe3b1f;
    stroke-width: 8;
    stroke-linecap: butt;
    fill: none;
  }

  .mirror-hit {
    stroke: transparent;
    stroke-width: 28;
    stroke-linecap: round;
    cursor: none;
  }

  .glyph-layer {
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .material-layer {
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .material-node,
  .material-frame {
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .material-frame {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  .material-drag-surface {
    fill: transparent;
    pointer-events: all;
  }

  .text-layer {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
    overflow: visible;
  }

  .text-content {
    width: 100%;
    max-width: 100%;
    color: #111111;
    font-family: var(--mirror-font-stack);
    font-weight: 400;
    line-height: 1.02;
    text-align: center;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
    overflow: visible;
  }

  .hidden-input {
    position: fixed;
    left: -9999px;
    top: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .control-panel {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
    width: 304px;
    max-height: calc(100vh - 32px);
    overflow: auto;
    padding: 12px;
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid rgba(0, 0, 0, 0.08);
    backdrop-filter: blur(8px);
    cursor: default;
    font-size: 12px;
    line-height: 1.35;
    color: #111111;
    font-family: var(--mirror-font-stack);
    display: none;
  }

  .control-panel.is-open {
    display: block;
  }

  .control-panel h2 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 600;
  }

  .control-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  .control-stack {
    display: grid;
    gap: 8px;
    margin-bottom: 10px;
  }

  .control-field {
    display: grid;
    gap: 4px;
  }

  .control-field label {
    font-size: 11px;
  }

  .control-field input,
  .control-field select,
  .control-field button,
  .control-field textarea {
    width: 100%;
    min-width: 0;
    padding: 6px 8px;
    border: 1px solid rgba(0, 0, 0, 0.16);
    background: #ffffff;
    color: #111111;
    font-family: var(--mirror-font-stack);
    font-size: inherit;
    font-weight: 400;
  }

  .control-field input[type="checkbox"] {
    width: auto;
    margin: 0;
  }

  .control-inline {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .button-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }

  .button-row.three {
    grid-template-columns: repeat(3, 1fr);
  }

  .auto-text-content {
    height: 108px;
    resize: vertical;
    font-size: 11px;
    line-height: 1.45;
    box-sizing: border-box;
  }

  .status-box {
    border: 1px solid rgba(0, 0, 0, 0.1);
    padding: 8px;
    min-height: 88px;
    white-space: pre-wrap;
  }

  .cursor-arrow {
    pointer-events: none;
    display: none;
  }

  .cursor-arrow path {
    fill: #fe3b1f;
  }

  .export-preview-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 6vw;
    background: rgba(255, 255, 255, 0.92);
    cursor: default;
  }

  .export-preview-overlay.is-open {
    display: flex;
  }

  .export-preview-card {
    width: min(82vw, 960px);
    display: grid;
    gap: 10px;
    color: #111111;
    font-family: var(--mirror-font-stack);
    font-size: 12px;
  }

  .export-preview-surface {
    aspect-ratio: 2 / 1;
    background: #ffffff;
    overflow: hidden;
    border: 1px solid rgba(211, 34, 34, 0.38);
  }

  .export-preview-surface svg {
    width: 100%;
    height: 100%;
  }

  .export-preview-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .export-preview-actions button {
    padding: 8px 10px;
    border: 1px solid rgba(0, 0, 0, 0.16);
    background: #ffffff;
    color: #111111;
    font-family: var(--mirror-font-stack);
    font-size: 12px;
  }

  body.print-exporting .control-panel,
  body.print-exporting .export-preview-overlay,
  body.print-exporting .cursor-arrow,
  body.print-exporting .mirror-hit {
    display: none !important;
  }

  @media print {
    @page {
      size: landscape;
      margin: 0;
    }

    html,
    body,
    main,
    svg {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .control-panel,
    .export-preview-overlay,
    .cursor-arrow,
    .mirror-hit {
      display: none !important;
    }
  }

  /* ── Q&A overlay ─────────────────────────────────────────────── */
  .qa-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    pointer-events: none;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 38px;
    gap: 4px;
    transition: opacity 360ms ease;
    text-align: center;
    white-space: nowrap;
  }

  .qa-overlay.qa-disabled {
    display: none;
  }

  .qa-question-zh,
  .qa-choice-zh,
  .qa-hint-zh,
  .qa-final-zh {
    font-size: 18px;
    line-height: 1.35;
    color: #111111;
    text-align: center;
    -webkit-text-stroke: 4px #ffffff;
    paint-order: stroke fill;
  }

  .qa-question-en,
  .qa-choice-en,
  .qa-hint-en,
  .qa-final-en {
    font-size: 16px;
    line-height: 1.35;
    color: #111111;
    text-align: center;
    -webkit-text-stroke: 4px #ffffff;
    paint-order: stroke fill;
  }

  .qa-question-zh {
    font-family: "FZFWZhuZGDSHJW", serif;
    font-weight: 400;
    white-space: pre-line;
  }

  .qa-question-en {
    font-family: "AkzidenzGrotesk", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    letter-spacing: 0.01em;
    white-space: pre-line;
  }

  .qa-choices {
    position: absolute;
    left: 50%;
    top: 62%;
    transform: translate(-50%, -50%);
    z-index: 22;
    display: grid;
    gap: 14px;
    width: 98vw;
    text-align: center;
    pointer-events: auto;
  }

  .qa-choices.qa-disabled {
    display: none;
  }

  .qa-choice {
    appearance: none;
    border: 0;
    background: transparent;
    padding: 0;
    margin: 0;
    display: flex;
    justify-content: center;
    gap: 0.38em;
    color: #111111;
    cursor: pointer;
    opacity: 0;
    transform: translateY(8px);
    white-space: nowrap;
    transition: color 140ms ease, opacity 360ms ease, transform 360ms ease;
  }

  .qa-choice.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  .qa-choice-zh {
    font-family: "FZFWZhuZGDSHJW", serif;
    font-weight: 400;
  }

  .qa-choice-en {
    font-family: "AkzidenzGrotesk", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .qa-choice:hover {
    color: #fe3b1f;
    opacity: 0.78;
    transform: translateX(4px);
    animation: qaChoiceFlicker 720ms steps(2, end) infinite;
  }

  .qa-choice.is-disabled {
    opacity: 0.36;
    cursor: default;
    animation: none;
    pointer-events: none;
  }

  .qa-choice.is-exiting {
    opacity: 0;
    transform: translateY(-8px);
    pointer-events: none;
    animation: none;
  }

  .qa-final-response {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    z-index: 24;
    display: none;
    color: #111111;
    text-align: center;
    pointer-events: none;
  }

  .qa-final-response .qa-final-zh,
  .qa-final-response .qa-final-en {
    color: #111111;
  }

  .qa-final-response.is-visible {
    display: block;
  }

  .qa-final-response.is-blinking {
    animation: qaFinalBlink 620ms steps(2, end) infinite;
  }

  @keyframes qaChoiceFlicker {
    0%, 100% { opacity: 0.78; }
    50% { opacity: 0.42; }
  }

  @keyframes qaFinalBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.18; }
  }

  @keyframes qaHintAlt {
    0%   { opacity: 0; }
    5%   { opacity: 1; }
    45%  { opacity: 1; }
    50%  { opacity: 0; }
    100% { opacity: 0; }
  }

  @keyframes hintBreath {
    0%, 30%, 100% { opacity: 1; }
    65% { opacity: 0; }
  }

  #qaHint.qa-disabled {
    display: none;
  }

  .qa-hint-card {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: grid;
    gap: 2px;
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
    opacity: 1;
    transition: opacity 360ms ease, transform 360ms ease;
    animation: hintBreath 1050ms ease-in-out infinite;
  }

  #qaHint.is-swapping .qa-hint-card {
    opacity: 0;
    transform: translate(-50%, 4px);
    animation: none;
  }

  .qa-hint-card-b {
    display: none;
  }

  .qa-hint-zh {
    font-family: "FZFWZhuZGDSHJW", serif;
    font-weight: 400;
  }

  .qa-hint-en {
    font-family: "AkzidenzGrotesk", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .qa-progress {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    z-index: 26;
    height: 8px;
    background: rgba(17, 17, 17, 0.12);
    pointer-events: none;
    overflow: hidden;
  }

  .qa-progress-fill {
    width: 100%;
    height: 100%;
    background: #fe3b1f;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* ── Opening sequence ─────────────────────────────────────────────── */
  #splashScreen {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 800ms ease;
    pointer-events: all;
  }

  #splashScreen.splash-out {
    opacity: 0;
    pointer-events: none;
  }

  .opening-frame {
    position: relative;
    width: 100vw;
    max-width: calc(100vh * 3680 / 972);
    aspect-ratio: 3680 / 972;
  }

  .opening-frame img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  .opening-text-box {
    position: absolute;
    left: 3.45%;
    top: 16.3%;
    width: 93.1%;
    height: 67.7%;
    padding: 0.8% 0.6%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #000000;
    text-align: center;
    white-space: pre;
    line-height: var(--opening-line-height, 1.04);
    letter-spacing: 0;
    font-size: var(--opening-font-size, min(3.72vw, 14.1vh));
    font-weight: 400;
    font-family: var(--mirror-font-stack);
    pointer-events: none;
  }

</style>
</head>
<body>
<main>
  <div id="splashScreen" aria-hidden="true">
    <div class="opening-frame">
      <img src="./rorrim-Regular-Blank.png" alt="" draggable="false" />
      <div id="openingTextBox" class="opening-text-box"></div>
    </div>
  </div>
  <aside class="control-panel" id="autoPanel">
    <h2>Auto Text</h2>
    <div class="control-field">
      <label for="autoTextContent">Text (editable)</label>
      <textarea id="autoTextContent" class="auto-text-content" spellcheck="false">THE PRECESSION OF SIMULACRA The simulacrum is never what hides the truth - it is truth that hides the fact that there is none. The simulacrum is true. -Ecclesiastes If once we were able to view the Borges fable in which the cartographers of the Empire draw up a map so detailed that it ends up covering the territory exactly (the decline of the Empire witnesses the fraying of this map, little by little, and its fall into ruins, though some shreds are still discernible in the deserts - the metaphysical beauty of this ruined abstraction testifying to a pride equal to the Empire and rotting like a carcass, returning to the substance of the soil, a bit as the double ends by being confused with the real through aging) - as the most beautiful allegory of simulation, this fable has now come full circle for us, and possesses nothing but the discrete charm of second-order simulacra.*1 Today abstraction is no longer that of the map, the double, the mirror, or the concept. Simulation is no longer that of a territory, a referential being, or a substance. It is the generation by models of a real without origin or reality: a hyperreal.</textarea>
    </div>
    <div class="button-row" style="margin-top:8px">
      <div class="control-field"><button id="autoTextStartButton" type="button">Start</button></div>
      <div class="control-field"><button id="autoTextStopButton" type="button">Stop</button></div>
    </div>
    <div class="status-box" id="autoTextStatus" style="min-height:28px">Ready</div>
    <hr style="margin:14px 0 12px;border:none;border-top:1px solid rgba(0,0,0,0.1)">
    <h2>Auto Search</h2>
    <div class="control-row">
      <div class="control-field">
        <label for="sourceChar">Mother</label>
        <input id="sourceChar" type="text" value="C" maxlength="1">
      </div>
      <div class="control-field">
        <label for="targetChar">Target</label>
        <input id="targetChar" type="text" value="O" maxlength="1">
      </div>
    </div>
    <div class="control-row">
      <div class="control-field">
        <label for="mirrorType">Mirror Axis</label>
        <select id="mirrorType">
          <option value="all">All Presets</option>
          <option value="current">Current Axis</option>
          <option value="horizontal">Horizontal</option>
          <option value="vertical">Vertical</option>
          <option value="diagonal">Diagonal</option>
          <option value="antiDiagonal">Anti-Diagonal</option>
        </select>
      </div>
      <div class="control-field">
        <label for="previewMode">Preview</label>
        <select id="previewMode">
          <option value="current">Current Result</option>
          <option value="mother">Mother</option>
          <option value="target">Target</option>
          <option value="overlay">Contour Overlay</option>
          <option value="skeleton">Skeleton Overlay</option>
        </select>
      </div>
    </div>
    <div class="control-row">
      <div class="control-field">
        <label for="threshold">Threshold</label>
        <input id="threshold" type="number" min="0" max="1" step="0.01" value="0.72">
      </div>
      <div class="control-field">
        <label for="searchStep">Coarse Step</label>
        <input id="searchStep" type="number" min="2" max="30" step="1" value="10">
      </div>
    </div>
    <div class="control-stack">
      <div class="control-inline">
        <input id="allowRotation" type="checkbox" checked>
        <label for="allowRotation">Allow Rotation</label>
      </div>
      <div class="control-inline">
        <input id="allowScale" type="checkbox" checked>
        <label for="allowScale">Allow Scale</label>
      </div>
      <div class="control-inline">
        <input id="allowTranslate" type="checkbox" checked>
        <label for="allowTranslate">Allow Translate</label>
      </div>
      <div class="control-inline">
        <input id="allowFlips" type="checkbox" checked>
        <label for="allowFlips">Allow Source Flips</label>
      </div>
    </div>
    <div class="control-row">
      <div class="control-field">
        <label for="weightContour">Contour Weight</label>
        <input id="weightContour" type="number" min="0" max="5" step="0.1" value="1.4">
      </div>
      <div class="control-field">
        <label for="weightSkeleton">Skeleton Weight</label>
        <input id="weightSkeleton" type="number" min="0" max="5" step="0.1" value="1.1">
      </div>
    </div>
    <div class="control-field">
      <label for="weightFeature">Feature Weight</label>
      <input id="weightFeature" type="number" min="0" max="5" step="0.1" value="1.0">
    </div>
    <div class="button-row">
      <div class="control-field"><button id="runSearchButton" type="button">Run Search</button></div>
      <div class="control-field"><button id="stopSearchButton" type="button">Stop</button></div>
    </div>
    <div class="button-row three">
      <div class="control-field"><button id="exportSvgButton" type="button">Export SVG</button></div>
      <div class="control-field"><button id="exportJsonButton" type="button">Export JSON</button></div>
      <div class="control-field"><button id="exportCsvButton" type="button">Export CSV</button></div>
    </div>
    <div class="control-stack">
      <div class="control-field">
        <label for="assetInput">Upload Image / PDF</label>
        <input id="assetInput" type="file" accept="image/png,image/jpeg,image/webp,application/pdf,.png,.jpg,.jpeg,.webp,.pdf">
      </div>
      <div class="control-row">
        <div class="control-field">
          <label for="assetScale">Asset Scale</label>
          <input id="assetScale" type="number" min="0.05" max="8" step="0.05" value="1">
        </div>
        <div class="control-field">
          <label for="assetRotation">Asset Rotation</label>
          <input id="assetRotation" type="number" min="-360" max="360" step="1" value="0">
        </div>
      </div>
      <div class="control-row">
        <div class="control-field">
          <label for="assetX">Asset X</label>
          <input id="assetX" type="number" step="1" value="600">
        </div>
        <div class="control-field">
          <label for="assetY">Asset Y</label>
          <input id="assetY" type="number" step="1" value="380">
        </div>
      </div>
      <div class="control-field">
        <button id="clearAssetButton" type="button">Clear Asset</button>
      </div>
    </div>
    <div class="control-field">
      <label for="exportPageSize">PDF Size</label>
      <select id="exportPageSize">
        <option value="screen">Screen / Browser Default</option>
        <option value="book-spread-60x30" selected>60mm x 30mm / 2:1 Spread</option>
      </select>
      <button id="exportPdfButton" type="button">Preview Vector PDF</button>
      <button id="exportPngButton" type="button">Export Print PNG 8x</button>
      <button id="exportVectorSvgButton" type="button">Download Vector SVG</button>
    </div>
    <div class="status-box" id="searchStatus">Idle</div>
  </aside>
  <svg id="stage" viewBox="0 0 1200 760" aria-label="C reflection experiment" tabindex="0">
    <defs>
      <clipPath id="originalClip" clipPathUnits="userSpaceOnUse">
        <polygon id="originalClipPolygon" points=""></polygon>
      </clipPath>
      <clipPath id="reflectionClip" clipPathUnits="userSpaceOnUse">
        <polygon id="reflectionClipPolygon" points=""></polygon>
      </clipPath>
    </defs>
    <g id="reflectionWrap" clip-path="url(#reflectionClip)">
      <g id="reflectionMaterial"></g>
      <g id="reflectionGlyph"></g>
      <g id="reflectionText"></g>
    </g>

    <g id="originalWrap" clip-path="url(#originalClip)">
      <g id="originalMaterial"></g>
      <g id="originalGlyph"></g>
      <g id="originalText"></g>
    </g>

    <g id="analysisLayer"></g>

    <g id="mirrorGroup">
      <path id="axisLine" class="mirror-axis" d="" stroke="#fe3b1f" stroke-width="8" stroke-linecap="butt" fill="none"></path>
      <line id="axisHit" class="mirror-hit" x1="160" y1="280" x2="1040" y2="280"></line>
    </g>
    <g id="cursorArrow" class="cursor-arrow" aria-hidden="true">
      <path d="M -2 -5.5 L 16 0 L -2 5.5 L 2.5 0 Z"></path>
    </g>
  </svg>

  function escapeHtml(value) {

  function escapeAttribute(value) {

  function fontFamilyForAge(startedAt, now = Date.now()) {
    return now - startedAt >= FONT_MATURATION_MS ? RORRIM_FONT_FAMILY : ANTIQUE_FONT_FAMILY;

  function hasPendingFontTransitions(now = Date.now()) {
    if (mode === 'single' && now - GLYPH.changedAt < FONT_MATURATION_MS) return true;
    if (mode === 'text') {
      return textCharTimes.some((startedAt) => now - startedAt < FONT_MATURATION_MS);

  function scheduleFontTransitionRender() {

    fontTransitionTimer = window.setTimeout(() => {

  function updateTextCharacterTimes(previous, next) {
    const now = Date.now();
    let prefix = 0;
    while (
      prefix < previous.length &&
      prefix < next.length &&
      previous[prefix] === next[prefix]
    ) {
      prefix += 1;
    }

    let suffix = 0;
    while (
      suffix < previous.length - prefix &&
      suffix < next.length - prefix &&
      previous[previous.length - 1 - suffix] === next[next.length - 1 - suffix]
    ) {
      suffix += 1;
    }

    const insertedLength = next.length - prefix - suffix;
    textCharTimes = [
      ...textCharTimes.slice(0, prefix),
      ...Array(Math.max(0, insertedLength)).fill(now),
      ...textCharTimes.slice(previous.length - suffix),
    ];
  }

  function textMeasureContext() {
    if (!textMeasureContext.canvas) {
      textMeasureContext.canvas = document.createElement('canvas');
      textMeasureContext.context = textMeasureContext.canvas.getContext('2d');
    }
    textMeasureContext.context.font = `400 ${textSize}px "${RORRIM_FONT_FAMILY}", sans-serif`;
    return textMeasureContext.context;
  }

  function wrapTextLine(value, maxWidth, startIndex = 0) {
    const context = textMeasureContext();
    const units = Array.from(value);
    const lines = [];
    let line = [];
    let lineText = '';
    units.forEach((unit, index) => {
      const candidate = lineText + unit;
      if (line.length && context.measureText(candidate).width > maxWidth) {
        lines.push(line);
        line = [{ char: unit, index: startIndex + index }];
        lineText = unit;
      } else {
        line.push({ char: unit, index: startIndex + index });
        lineText = candidate;
      }
    });
    lines.push(line);
    return lines;
  }

  function svgTextLines() {
    const maxWidth = STAGE.width + 20;
    const paragraphs = textValue.split('\n');
    const lines = [];
    let offset = 0;
    paragraphs.forEach((paragraph, index) => {
      lines.push(...wrapTextLine(paragraph, maxWidth, offset));
      offset += paragraph.length;
      if (index < paragraphs.length - 1) {
        lines.push([]);
        offset += 1;
      }
    });
    return lines;
  }

  function computeTextStartY(lines, lineHeight) {
    const totalSpan = (lines.length - 1) * lineHeight;
    const centeredY = STAGE.height / 2 - totalSpan / 2;
    // When text overflows, anchor so the last line stays near the bottom
    const bottomAnchorY = STAGE.height - lineHeight * 0.65 - totalSpan;
    return Math.min(centeredY, bottomAnchorY);
  }

  function textMarkup() {
    const lines = svgTextLines();
    const now = Date.now();
    const lineHeight = textSize * 1.02;
    const startY = computeTextStartY(lines, lineHeight);
    const textLines = lines.map((line, lineIndex) => {
      const tspans = line.map(({ char, index }) => {
        const fontFamily = fontFamilyForAge(textCharTimes[index] || now, now);
        return `<tspan font-family="'${escapeAttribute(fontFamily)}', sans-serif">${escapeHtml(char)}</tspan>`;
      }).join('');
      return `
        <text
          class="svg-text-layer"
          x="-10"
          y="${startY + lineIndex * lineHeight}"
          text-anchor="start"
          dominant-baseline="central"
          xml:space="preserve"
          font-size="${textSize}"
          font-weight="400"
          fill="#111111"
        >${tspans}</text>
      `;
    }).join('');

    return `
      <g class="svg-text-lines">
        ${textLines}
      </g>
    `;
  }

    uploadedAsset.width = width * ratio;
    uploadedAsset.height = height * ratio;
    uploadedAsset.x = STAGE.width / 2;
    uploadedAsset.y = STAGE.height / 2;
    uploadedAsset.scale = 1;
    uploadedAsset.rotation = 0;

  function setUploadedAssetFromFile(file) {
    if (!file) return;
    const type = file.type || '';
    const lowerName = file.name.toLowerCase();
    const isImage = type.startsWith('image/') || /\.(png|jpe?g|webp)$/.test(lowerName);
    const isPdf = type === 'application/pdf' || lowerName.endsWith('.pdf');
    if (!isImage && !isPdf) {
      setStatus('Please upload png, jpg, jpeg, webp, or pdf.');
      return;
    }

    revokeCurrentAssetUrl();
    uploadedAsset.url = URL.createObjectURL(file);
    uploadedAsset.fileName = file.name;
    uploadedAsset.dataReady = Promise.resolve();

    if (isPdf) {
      uploadedAsset.kind = 'pdf';
      fitAssetToStage(612, 792);
      updateAssetControls();
      setStatus(`Loaded PDF placeholder: ${file.name}. Native SVG/PNG export requires converting this PDF page to an image first.`);
      render();
      return;
    }

    const probe = new Image();
    probe.onload = () => {
      uploadedAsset.kind = 'image';
      uploadedAsset.image = probe;
      fitAssetToStage(probe.naturalWidth || 420, probe.naturalHeight || 420);
      updateAssetControls();
      setStatus(`Loaded image: ${file.name}`);
      render();
    };
    probe.onerror = () => {
      revokeCurrentAssetUrl();
      uploadedAsset.kind = null;
      uploadedAsset.image = null;
      setStatus(`Could not load image: ${file.name}`);
      render();
    };
    probe.src = uploadedAsset.url;

    const reader = new FileReader();
    uploadedAsset.dataReady = new Promise((resolve, reject) => {
      reader.onload = () => {
        uploadedAsset.dataUrl = String(reader.result || '');
        render();
        resolve();
      };
      reader.onerror = () => reject(new Error(`Could not embed image data: ${file.name}`));
    });
    reader.readAsDataURL(file);
  }

    }
  }

  function toggleMode() {
    stopAutoText();
    if (mode === 'single') {
      mode = 'text';
    } else if (mode === 'text') {
      mode = 'empty';
    } else {
      mode = 'single';
    }
    render();
    applyModeFocus();
    setStatus(`Mode: ${mode}`);
  }

  function toggleSpatialMode() {
    spatial.mode = spatial.mode === 'mirror' ? 'slice' : 'mirror';
    if (spatial.mode === 'slice') {
      startSpatialAnimation();
    } else {
      stopSpatialAnimation();
    }
    setStatus(spatial.mode === 'slice' ? 'Dynamic seam mode' : 'Mirror mode');
    render();
  }

  function startSpatialAnimation() {
    if (spatial.frame) return;
    const tick = (time) => {
      spatial.time = time * 0.001;
      render();
      spatial.frame = requestAnimationFrame(tick);
    };
    spatial.frame = requestAnimationFrame(tick);
  }

  function stopSpatialAnimation() {
    if (!spatial.frame) return;
    cancelAnimationFrame(spatial.frame);
    spatial.frame = null;
  }

  function pointerAngleAroundMirror(point) {
    return Math.atan2(point.y - mirror.cy, point.x - mirror.cx);
  }

  function svgPointFromClient(clientX, clientY) {
    const point = stage.createSVGPoint();
    point.x = clientX;
    point.y = clientY;
    return point.matrixTransform(stage.getScreenCTM().inverse());
  }

  function lineEndpoints(cx = mirror.cx, cy = mirror.cy, angle = mirror.angle) {
    const ux = Math.cos(angle);
    const uy = Math.sin(angle);
    return {
      ax: cx - ux * EXTENT,
      ay: cy - uy * EXTENT,
      bx: cx + ux * EXTENT,
      by: cy + uy * EXTENT,
      ux,
      uy,
      nx: -uy,
      ny: ux,
    };
  }

  function matrixForReflection() {
    const cos2 = Math.cos(2 * mirror.angle);
    const sin2 = Math.sin(2 * mirror.angle);
    const a = cos2;
    const b = sin2;
    const c = sin2;
    const d = -cos2;
    const e = mirror.cx - a * mirror.cx - c * mirror.cy;
    const f = mirror.cy - b * mirror.cx - d * mirror.cy;
    return { a, b, c, d, e, f };
  }

  function multiplyMatrix(left, right) {
    return {
      a: left.a * right.a + left.c * right.b,
      b: left.b * right.a + left.d * right.b,
      c: left.a * right.c + left.c * right.d,
      d: left.b * right.c + left.d * right.d,
      e: left.a * right.e + left.c * right.f + left.e,
      f: left.b * right.e + left.d * right.f + left.f,
    };
  }

  function translationMatrix(x, y) {
    return { a: 1, b: 0, c: 0, d: 1, e: x, f: y };
  }

  function rotationMatrixAround(cx, cy, angle) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    return {
      a: cos,
      b: sin,
      c: -sin,
      d: cos,
      e: cx - cos * cx + sin * cy,
      f: cy - sin * cx - cos * cy,
    };
  }

  function scaleMatrixAround(cx, cy, scale) {
    return {
      a: scale,
      b: 0,
      c: 0,
      d: scale,
      e: cx - scale * cx,
      f: cy - scale * cy,
    };
  }

  function matrixToString(matrix) {
    return `matrix(${matrix.a} ${matrix.b} ${matrix.c} ${matrix.d} ${matrix.e} ${matrix.f})`;
  }

  function pointByMatrix(matrix, x, y) {
    return {
      x: matrix.a * x + matrix.c * y + matrix.e,
      y: matrix.b * x + matrix.d * y + matrix.f,
    };
  }

  function seamDriftVector() {
    const { ux, uy, nx, ny } = lineEndpoints();
    return {
      x: ux * spatial.driftTangent + nx * spatial.driftNormal,
      y: uy * spatial.driftTangent + ny * spatial.driftNormal,
    };
  }

  function recursivePortalStepMatrix() {
    const drift = seamDriftVector();
    const reindexed = matrixForReflection();
    const scaled = scaleMatrixAround(mirror.cx, mirror.cy, spatial.scale);
    const rotated = rotationMatrixAround(mirror.cx, mirror.cy, spatial.foldAngle);
    const shifted = translationMatrix(drift.x, drift.y);
    return multiplyMatrix(shifted, multiplyMatrix(rotated, multiplyMatrix(scaled, reindexed)));
  }

  function seamCoordinates(x, y) {
    const { ux, uy, nx, ny } = lineEndpoints();
    const dx = x - mirror.cx;
    const dy = y - mirror.cy;
    return {
      tangent: dx * ux + dy * uy,
      distance: dx * nx + dy * ny,
      ux,
      uy,
      nx,
      ny,
    };
  }

  function pointFromSeam(tangent, distance, basis) {
    return {
      x: mirror.cx + basis.ux * tangent + basis.nx * distance,
      y: mirror.cy + basis.uy * tangent + basis.ny * distance,
    };
  }

  function wrap(value, min, max) {
    const range = max - min;
    return ((((value - min) % range) + range) % range) + min;
  }

  function baseTokenText() {
    const value = mode === 'single' ? GLYPH.char : textValue;
    const words = value.trim().split(/\s+/).filter(Boolean);
    if (words.length > 1) return words;
    return Array.from(value);
  }

  function tokenSeed(index) {
    const s = Math.sin(index * 12.9898) * 43758.5453;
    return s - Math.floor(s);
  }

  function warpedToken(index, label) {
    const t = spatial.time;
    const row = Math.floor(index / 9);
    const col = index % 9;
    const seed = tokenSeed(index);
    const tangent = wrap(
      -720 + col * 180 + row * 42 + t * (18 + seed * 16),
      -860,
      860
    );
    const sourceDistance = -38 - (row % 5) * 54 - seed * 34;
    const seam = lineEndpoints();
    const band = Math.max(0, 1 - Math.abs(sourceDistance) / spatial.foldBandWidth);
    const pass = 1 + ((row + col + Math.floor(t * 0.85 + seed * 3)) % spatial.foldDepth);
    const mappedDistance = Math.abs(sourceDistance) * Math.pow(0.76, pass) + 18 * pass;
    const z = Math.sin(sourceDistance * spatial.frequency + t * 1.55 + seed * 6) * spatial.amplitude * band;
    const tangentWarp = Math.sin(t * 0.9 + tangent * 0.012 + seed * 9) * spatial.drift * band;
    const normalWarp = Math.cos(t * 1.2 + tangent * spatial.frequency + seed * 5) * spatial.verticalWarp * band;
    const point = pointFromSeam(
      tangent + tangentWarp + pass * (10 + seed * 9),
      mappedDistance + normalWarp,
      seam
    );
    const rotation = (mirror.angle * 180 / Math.PI)
      + Math.sin(t * 0.9 + index * 0.41) * 16 * band
      + pass * 5.5;
    const scale = Math.max(0.38, 1 + z / 380 - pass * 0.08);
    const size = Math.max(22, Math.min(190, textSize * 0.72 * scale));
    return {
      label,
      x: point.x,
      y: point.y,
      rotation,
      size,
      pass,
    };
  }

  function dynamicSliceMarkup() {
    const tokens = baseTokenText();
    const mappedClipPoints = pointsAttribute(
      polygonPointsForHalfPlane(1, mirror.cx, mirror.cy, mirror.angle, BOUNDARY_CLEARANCE)
    );
    let markup = `
      <defs>
        <clipPath id="sliceMappedClip" clipPathUnits="userSpaceOnUse">
          <polygon points="${mappedClipPoints}"></polygon>
        </clipPath>
      </defs>
      <g clip-path="url(#sliceMappedClip)">
    `;
    for (let index = 0; index < 126; index += 1) {
      const token = warpedToken(index, tokens[index % tokens.length]);
      markup += `
        <text
          x="${token.x.toFixed(2)}"
          y="${token.y.toFixed(2)}"
          transform="rotate(${token.rotation.toFixed(2)} ${token.x.toFixed(2)} ${token.y.toFixed(2)})"
          text-anchor="middle"
          dominant-baseline="central"
          font-family="'${escapeAttribute(currentFontFamily)}', sans-serif"
          font-size="${token.size.toFixed(2)}"
          font-weight="400"
          fill="#111111"
        >${escapeHtml(token.label)}</text>
      `;
    }
    return `${markup}</g>`;
  }

  function currentContentMarkup() {
    if (mode === 'single') return glyphInnerMarkup();
    if (mode === 'empty') return '';
    return textMarkup();
  }

  function boundaryFromMatrix(matrix) {
    const { ux, uy } = lineEndpoints();
    const center = pointByMatrix(matrix, mirror.cx, mirror.cy);
    const directionPoint = pointByMatrix(matrix, mirror.cx + ux, mirror.cy + uy);
    const dx = directionPoint.x - center.x;
    const dy = directionPoint.y - center.y;
    const length = Math.hypot(dx, dy) || 1;
    const tx = dx / length;
    const ty = dy / length;
    return {
      cx: center.x,
      cy: center.y,
      ux: tx,
      uy: ty,
      nx: -ty,
      ny: tx,
    };
  }

  function boundaryLineMarkup(boundary, opacity = 1, className = 'mirror-axis') {
    const startX = boundary.cx - boundary.ux * RECURSIVE_EXTENT;
    const startY = boundary.cy - boundary.uy * RECURSIVE_EXTENT;
    const endX = boundary.cx + boundary.ux * RECURSIVE_EXTENT;
    const endY = boundary.cy + boundary.uy * RECURSIVE_EXTENT;
    return `<path class="${className}" stroke="${MIRROR_RED}" stroke-width="8" stroke-linecap="butt" fill="none" style="stroke:${MIRROR_RED};stroke-width:8;opacity:${opacity.toFixed(3)}" d="M ${startX} ${startY} L ${endX} ${endY}"></path>`;
  }

  function polygonForBoundaryHalfPlane(boundary, sign, clearance = 0) {
    const cx = boundary.cx + boundary.nx * clearance * sign;
    const cy = boundary.cy + boundary.ny * clearance * sign;
    const p1x = cx - boundary.ux * EXTENT;
    const p1y = cy - boundary.uy * EXTENT;
    const p2x = cx + boundary.ux * EXTENT;
    const p2y = cy + boundary.uy * EXTENT;
    const offx = boundary.nx * EXTENT * sign;
    const offy = boundary.ny * EXTENT * sign;
    return [
      [p1x, p1y],
      [p2x, p2y],
      [p2x + offx, p2y + offy],
      [p1x + offx, p1y + offy],
    ];
  }

  function pointsAttribute(points) {
    return points.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
  }

  function recursiveSliceMarkup() {
    const content = currentContentMarkup();
    let matrix = recursivePortalStepMatrix();
    let clips = `<defs><clipPath id="recursiveMainSeamClip" clipPathUnits="userSpaceOnUse"><polygon points="${pointsAttribute(polygonPointsForHalfPlane(1, mirror.cx, mirror.cy, mirror.angle, BOUNDARY_CLEARANCE))}"></polygon></clipPath>`;
    let bodies = '<g clip-path="url(#recursiveMainSeamClip)">';
    let boundaries = '';

    for (let index = 0; index < spatial.depth; index += 1) {
      const boundary = boundaryFromMatrix(matrix);
      const clipId = `recursiveSliceClip${index}`;
      const opacity = Math.max(0.22, 0.82 - index * 0.045);
      const lineOpacity = Math.max(0.18, 0.62 - index * 0.035);
      clips += `<clipPath id="${clipId}" clipPathUnits="userSpaceOnUse"><polygon points="${pointsAttribute(polygonForBoundaryHalfPlane(boundary, 1, BOUNDARY_CLEARANCE))}"></polygon></clipPath>`;
      bodies += `
        <g clip-path="url(#${clipId})" style="opacity:${opacity.toFixed(3)}">
          <g transform="${matrixToString(matrix)}">${content}</g>
        </g>
      `;
      boundaries += boundaryLineMarkup(boundary, lineOpacity);
      matrix = multiplyMatrix(recursivePortalStepMatrix(), matrix);
    }

    bodies += '</g>';
    return `${clips}</defs>${bodies}${boundaries}`;
  }

  function polygonPointsForHalfPlane(sign, cx = mirror.cx, cy = mirror.cy, angle = mirror.angle, clearance = 0) {
    const { ux, uy, nx, ny } = lineEndpoints(cx, cy, angle);
    const shiftedCx = cx + nx * clearance * sign;
    const shiftedCy = cy + ny * clearance * sign;
    const p1x = shiftedCx - ux * EXTENT;
    const p1y = shiftedCy - uy * EXTENT;
    const p2x = shiftedCx + ux * EXTENT;
    const p2y = shiftedCy + uy * EXTENT;
    const offx = nx * EXTENT * sign;
    const offy = ny * EXTENT * sign;
    return [
      [p1x, p1y],
      [p2x, p2y],
      [p2x + offx, p2y + offy],
      [p1x + offx, p1y + offy],
    ];
  }

  function setPolygon(el, points) {
    el.setAttribute(
      'points',
      pointsAttribute(points)
    );
  }

  function updateCursor() {
    cursorArrow.style.display = cursorVisible ? 'block' : 'none';
    if (!cursorVisible) return;
    const degrees = mirror.angle * 180 / Math.PI;
    cursorArrow.setAttribute(
      'transform',
      `translate(${cursorPosition.x} ${cursorPosition.y}) rotate(${degrees})`
    );
  }

  function render() {
    const { ax, ay, bx, by } = lineEndpoints();
    const showSingle = mode === 'single';
    const showText = mode === 'text';
    const showSlice = spatial.mode === 'slice';
    originalMaterial.innerHTML = assetMarkup(true);
    reflectionMaterial.innerHTML = !showSlice ? assetMarkup(false) : '';
    originalGlyph.innerHTML = showSingle ? glyphInnerMarkup() : '';
    reflectionGlyph.innerHTML = showSingle && !showSlice ? glyphInnerMarkup() : '';
    originalText.innerHTML = showText ? textMarkup() : '';
    reflectionText.innerHTML = showText && !showSlice ? textMarkup() : '';
    analysisLayer.innerHTML = showSlice ? dynamicSliceMarkup() : '';

    axisLine.setAttribute('d', `M ${ax} ${ay} L ${bx} ${by}`);
    axisLine.setAttribute('stroke', MIRROR_RED);
    axisLine.setAttribute('stroke-width', '8');
    axisLine.setAttribute('stroke-linecap', 'butt');
    axisLine.setAttribute('fill', 'none');
    axisLine.style.stroke = MIRROR_RED;
    axisLine.style.strokeWidth = '8';
    axisLine.style.strokeLinecap = 'butt';

    axisHit.setAttribute('x1', ax);
    axisHit.setAttribute('y1', ay);
    axisHit.setAttribute('x2', bx);
    axisHit.setAttribute('y2', by);

    const matrix = matrixForReflection();
    reflectionGlyph.setAttribute(
      'transform',
      `matrix(${matrix.a} ${matrix.b} ${matrix.c} ${matrix.d} ${matrix.e} ${matrix.f})`
    );
    reflectionText.setAttribute(
      'transform',
      `matrix(${matrix.a} ${matrix.b} ${matrix.c} ${matrix.d} ${matrix.e} ${matrix.f})`
    );
    reflectionMaterial.setAttribute(
      'transform',
      `matrix(${matrix.a} ${matrix.b} ${matrix.c} ${matrix.d} ${matrix.e} ${matrix.f})`
    );

    setPolygon(originalClipPolygon, polygonPointsForHalfPlane(-1, mirror.cx, mirror.cy, mirror.angle, showSlice ? BOUNDARY_CLEARANCE : 0));
    setPolygon(reflectionClipPolygon, polygonPointsForHalfPlane(1, mirror.cx, mirror.cy, mirror.angle, showSlice ? BOUNDARY_CLEARANCE : 0));
    updateCursor();
    scheduleFontTransitionRender();
    if (typeof externalRenderHook === 'function') externalRenderHook();
  }

  function startDrag(mode, event) {
    cancelMirrorJoy();
    dragMode = mode;
    dragStart = svgPointFromClient(event.clientX, event.clientY);
    if (mode === 'rotate') {
      rotateStartAngle = mirror.angle;
      rotateStartPointerAngle = pointerAngleAroundMirror(dragStart);
    }
    event.target.setPointerCapture(event.pointerId);
    event.preventDefault();
  }

  function startMaterialDrag(event) {
    dragMode = event.shiftKey ? 'material-rotate' : (event.altKey ? 'material-scale' : 'material-move');
    dragStart = svgPointFromClient(event.clientX, event.clientY);
    assetDragStart = {
      x: uploadedAsset.x,
      y: uploadedAsset.y,
      scale: uploadedAsset.scale,
      rotation: uploadedAsset.rotation,
      pointerAngle: Math.atan2(dragStart.y - uploadedAsset.y, dragStart.x - uploadedAsset.x),
      pointerDistance: Math.hypot(dragStart.x - uploadedAsset.x, dragStart.y - uploadedAsset.y) || 1,
    };
    event.target.setPointerCapture(event.pointerId);
    event.preventDefault();
  }

  axisHit.addEventListener('pointerdown', (event) => {
    startDrag(event.shiftKey ? 'rotate' : 'move', event);
  });
  stage.addEventListener('pointerdown', (event) => {
    if (uploadedAsset.kind && event.target.closest && event.target.closest('.material-drag-surface')) {
      startMaterialDrag(event);
      return;
    }
    if (event.target === axisHit || event.target === axisLine) {
      startDrag(event.shiftKey ? 'rotate' : 'move', event);
      return;
    }
    startDrag(event.shiftKey ? 'rotate' : 'move', event);
  });

  stage.addEventListener('pointermove', (event) => {
    cursorPosition = svgPointFromClient(event.clientX, event.clientY);
    if (!dragMode) {
      updateCursor();
      return;
    }
    const point = cursorPosition;

    if (dragMode === 'move') {
      const dx = point.x - dragStart.x;
      const dy = point.y - dragStart.y;
      mirror.cx += dx;
      mirror.cy += dy;
      dragStart = point;
      if (tutorialActive && tutorialStep === 'move' && Math.hypot(dx, dy) > 0.8) {
        setTutorialStep('move-good');
      }
    } else if (dragMode === 'rotate') {
      mirror.angle = rotateStartAngle + (pointerAngleAroundMirror(point) - rotateStartPointerAngle);
      if (tutorialActive && tutorialStep === 'rotate' && Math.abs(mirror.angle - rotateStartAngle) > 0.04) {
        setTutorialStep('good');
      }
    } else if (dragMode === 'material-move') {
      uploadedAsset.x = assetDragStart.x + point.x - dragStart.x;
      uploadedAsset.y = assetDragStart.y + point.y - dragStart.y;
      updateAssetControls();
    } else if (dragMode === 'material-rotate') {
      const angle = Math.atan2(point.y - uploadedAsset.y, point.x - uploadedAsset.x);
      uploadedAsset.rotation = assetDragStart.rotation + (angle - assetDragStart.pointerAngle) * 180 / Math.PI;
      updateAssetControls();
    } else if (dragMode === 'material-scale') {
      const distance = Math.hypot(point.x - uploadedAsset.x, point.y - uploadedAsset.y) || 1;
      uploadedAsset.scale = Math.max(0.05, assetDragStart.scale * distance / assetDragStart.pointerDistance);
      updateAssetControls();
    }

    render();
    event.preventDefault();
  });

  stage.addEventListener('pointerenter', (event) => {
    cursorVisible = true;
    cursorPosition = svgPointFromClient(event.clientX, event.clientY);
    updateCursor();
  });

  stage.addEventListener('pointerleave', () => {
    cursorVisible = false;
    stopDrag();
    updateCursor();
  });

  function stopDrag() {
    dragMode = null;
    assetDragStart = null;
  }

  stage.addEventListener('pointerup', stopDrag);
  stage.addEventListener('pointercancel', stopDrag);
  stage.addEventListener('mousedown', (event) => event.preventDefault());
  stage.addEventListener('dragstart', (event) => event.preventDefault());

  document.addEventListener('keydown', (event) => {
    if (!openingActive) return;
    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);

  stage.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      event.preventDefault();
      window.parent.postMessage('closeAlphabetOverlay', '*');
      return;
    }
    if (qaEnabled) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    if (event.key === 'Tab') {
      event.preventDefault();
      toggleMode();
      return;
    }
    if (mode !== 'single') return;
    if (event.key === 'ArrowLeft') {
      GLYPH.rotation -= 5;
      render();
    } else if (event.key === 'ArrowRight') {
      GLYPH.rotation += 5;
      render();
    } else if (event.key === 'ArrowUp') {
      GLYPH.mirrorX *= -1;
      render();
    } else if (event.key === 'ArrowDown') {
      GLYPH.mirrorY *= -1;
      render();
    } else if (event.key.length === 1) {
      GLYPH.char = event.key;
      GLYPH.changedAt = Date.now();
      render();
    } else {
      return;
    }
    event.preventDefault();
  });

  textInput.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      event.preventDefault();
      window.parent.postMessage('closeAlphabetOverlay', '*');
      return;
    }
    if (tutorialActive) {
      if (event.key === 'Enter' && tutorialReadyForQuestions) {
        event.preventDefault();
        event.stopImmediatePropagation();
        beginQuestionSequence();
      } else if (tutorialStep !== 'type') {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
      return;
    }
    if (qaEnabled) {
      if (alphabetInputLocked) {
        event.preventDefault();
        event.stopImmediatePropagation();
        return;
      }
      if (event.key === 'Enter' && !event.shiftKey && !alphabetInputComposing && !event.isComposing) {
        event.preventDefault();
        event.stopImmediatePropagation();
        submitAlphabetInput();
        return;
      }
      event.stopImmediatePropagation();
    }
  });

  textInput.addEventListener('beforeinput', (event) => {
    if (tutorialActive && tutorialStep !== 'type') {
      event.preventDefault();
      return;
    }
    if (!qaEnabled) return;
    if (alphabetInputLocked) event.preventDefault();
  });

  textInput.addEventListener('paste', (event) => {
    if (!qaEnabled) return;
    if (alphabetInputLocked) event.preventDefault();
  });

  textInput.addEventListener('compositionstart', () => {
    alphabetInputComposing = true;
  });

  textInput.addEventListener('compositionend', () => {
    alphabetInputComposing = false;
    if (qaEnabled && !qaMachineTyping && !alphabetInputLocked) {
      const prevValue = textValue;
      textInput.value = normalizeAlphabetInput(textInput.value);
      inputValue = textInput.value;
      renderAlphabetInputText(inputValue);
      triggerJoyForNewAbc(prevValue, textValue);
    }
  });

  // Mirror joy animation — triggers when A, B, or C (uppercase) is typed in text mode
  let mirrorJoyAnim = null;

  function cancelMirrorJoy() {
    if (mirrorJoyAnim !== null) {
      cancelAnimationFrame(mirrorJoyAnim);
      mirrorJoyAnim = null;
    }
  }

  function detectNewJoyChar(prev, next) {
    if (next.length !== prev.length + 1) return null;
    for (let i = 0; i <= prev.length; i++) {
      if (i === prev.length || next[i] !== prev[i]) {
        const c = next[i];
        return (c === 'A' || c === 'B' || c === 'C') ? { char: c, index: i } : null;
      }
    }
    return null;
  }

  function detectNewJoyCharInText(prev, next) {
    const direct = detectNewJoyChar(prev, next);
    if (direct) return direct;
    const maxLength = Math.max(prev.length, next.length);
    for (let i = 0; i < maxLength; i++) {
      if (prev[i] !== next[i]) {
        for (let j = i; j < next.length; j++) {
          const char = next[j];
          if (char === 'A' || char === 'B' || char === 'C') {
            return { char, index: j };
          }
        }
        return null;
      }
    }
    return null;
  }

  function findJoyCharPos(charIndex) {
    const lines = svgTextLines();
    const lineHeight = textSize * 1.02;
    const startY = computeTextStartY(lines, lineHeight);
    for (let li = 0; li < lines.length; li++) {
      for (let ci = 0; ci < lines[li].length; ci++) {
        if (lines[li][ci].index === charIndex) {
          const textEls = originalText.querySelectorAll('text');
          if (textEls[li]) {
            const tspans = textEls[li].querySelectorAll('tspan');
            if (tspans[ci]) {
              try {
                const bbox = tspans[ci].getBBox();
                return { x: bbox.x + bbox.width / 2, y: bbox.y + bbox.height / 2 };
              } catch (_) {}
            }
          }
          return { x: STAGE.width / 2, y: startY + li * lineHeight };
        }
      }
    }
    return null;
  }

  function triggerMirrorJoy(targetX, targetY) {
    cancelMirrorJoy();
    const startCx = mirror.cx, startCy = mirror.cy, startAngle = mirror.angle;
    const DURATION = 3000;
    const totalRot = (1 + Math.random()) * 2 * Math.PI;
    const rotPow = 2 + Math.random() * 2;

    // Build waypoints: start → 2–4 random points → target
    const numMid = 2 + Math.floor(Math.random() * 3);
    const pts = [[startCx, startCy]];
    for (let i = 0; i < numMid; i++) {
      pts.push([
        STAGE.width * 0.1 + Math.random() * STAGE.width * 0.8,
        STAGE.height * 0.1 + Math.random() * STAGE.height * 0.8,
      ]);
    }
    pts.push([targetX, targetY]);

    // Per-segment easing: first/last ease-out (< 1), middle random
    const n = pts.length - 1;
    const segPow = pts.map((_, i) =>
      (i === 0 || i === n - 1) ? 0.3 + Math.random() * 0.4 : 0.5 + Math.random() * 3.5
    );

    function catmullRom(p0, p1, p2, p3, t) {
      return 0.5 * (2*p1 + (-p0+p2)*t + (2*p0-5*p1+4*p2-p3)*t*t + (-p0+3*p1-3*p2+p3)*t*t*t);
    }

    function posAtRaw(rawT) {
      const seg = Math.min(Math.floor(rawT * n), n - 1);
      const st = Math.pow(rawT * n - seg, segPow[seg]);
      const p0 = pts[Math.max(seg-1, 0)], p1 = pts[seg];
      const p2 = pts[Math.min(seg+1, n)],  p3 = pts[Math.min(seg+2, n)];
      return [
        catmullRom(p0[0], p1[0], p2[0], p3[0], st),
        catmullRom(p0[1], p1[1], p2[1], p3[1], st),
      ];
    }

    const t0 = performance.now();

    function tick(now) {
      const raw = Math.min((now - t0) / DURATION, 1);
      const [cx, cy] = posAtRaw(raw);
      mirror.cx = cx;
      mirror.cy = cy;
      // Rotation: ease-out — spins fast then settles as it arrives
      mirror.angle = startAngle + totalRot * (1 - Math.pow(1 - raw, rotPow));
      render();
      if (raw < 1) {
        mirrorJoyAnim = requestAnimationFrame(tick);
      } else {
        mirror.cx = targetX;
        mirror.cy = targetY;
        mirrorJoyAnim = null;
        render();
      }
    }

    mirrorJoyAnim = requestAnimationFrame(tick);
  }

  function triggerJoyForNewAbc(prevValue, nextValue) {
    const joy = detectNewJoyCharInText(prevValue, nextValue);
    if (!joy) return;
    const pos = findJoyCharPos(joy.index);
    if (pos) triggerMirrorJoy(pos.x, pos.y);
  }

  textInput.addEventListener('input', () => {
    if (qaEnabled && !qaMachineTyping) {
      const prevValue = textValue;
      const normalized = alphabetInputComposing ? textInput.value : normalizeAlphabetInput(textInput.value);
      if (textInput.value !== normalized) {
        const selectionStart = textInput.selectionStart;
        const selectionEnd = textInput.selectionEnd;
        textInput.value = normalized;
        textInput.setSelectionRange(selectionStart, selectionEnd);
      }
      inputValue = normalized;
      renderAlphabetInputText(inputValue);
      if (!alphabetInputComposing) {
        triggerJoyForNewAbc(prevValue, textValue);
      }
      return;
    }
    const prevValue = textValue;
    const nextValue = textInput.value;
    updateTextCharacterTimes(textValue, nextValue);
    textValue = nextValue;
    if (mode === 'text') {
      render();
      const joy = qaMachineTyping || !qaEnabled ? detectNewJoyChar(prevValue, nextValue) : null;
      if (joy) {
        const pos = findJoyCharPos(joy.index);
        if (pos) triggerMirrorJoy(pos.x, pos.y);
      }
    }
  });

  // ── Q&A: click anywhere refocuses text input ─────────────────────
  document.addEventListener('click', () => {
    if (finalPendingMessage) {
      window.parent.postMessage(finalPendingMessage, '*');
      finalPendingMessage = null;
      return;
    }
    if (openingActive) return;
    if (mode === 'text') {
      textInput.focus();
      textInput.setSelectionRange(textInput.value.length, textInput.value.length);
    }
  });

  // ── Q&A functions ────────────────────────────────────────────────
  function clearQaAutoTypingTimer() {
    if (qaAutoTypingTimer !== null) {
      clearTimeout(qaAutoTypingTimer);
      qaAutoTypingTimer = null;
    }
    qaMachineTyping = false;
  }

  function qaTypingDelay(char, previousChar = '') {
    let delay = 55 + Math.random() * 95;
    if (char === ' ') delay += 30 + Math.random() * 45;
    if ('.,;:!?'.includes(char)) delay += 95 + Math.random() * 150;
    if (char === '—' || char === '-') delay += 45 + Math.random() * 90;
    if ('.:!?'.includes(previousChar)) delay += 150 + Math.random() * 220;
    if (Math.random() < 0.1) delay *= 0.45;
    return delay;
  }

  function typeTextByMachine(value) {
    clearQaAutoTypingTimer();
    return new Promise((resolve) => {
      const chars = Array.from(value);
      let index = 0;
      qaMachineTyping = true;
      function typeNext() {
        if (index >= chars.length) {
          qaAutoTypingTimer = null;
          qaMachineTyping = false;
          resolve();
          return;
        }
        const char = chars[index];
        const previousChar = index > 0 ? chars[index - 1] : '';
        textInput.value += char;
        textInput.dispatchEvent(new Event('input', { bubbles: true }));
        index += 1;
        qaAutoTypingTimer = setTimeout(typeNext, qaTypingDelay(char, previousChar));
      }
      typeNext();
    });
  }

  function setQaChoicesEnabled(enabled) {
    qaChoicesEl.querySelectorAll('.qa-choice').forEach((choice) => {
      choice.classList.toggle('is-disabled', !enabled);
      choice.setAttribute('aria-disabled', String(!enabled));
    });
  }

  function dismissChoices() {
    const choices = Array.from(qaChoicesEl.querySelectorAll('.qa-choice'));
    choices.forEach((choice, index) => {
      window.setTimeout(() => {
        choice.classList.add('is-exiting');
      }, index * 120);
    });
    return wait(choices.length * 120 + 420);
  }

  function stopMadness() {
    if (madnessFrame !== null) {
      cancelAnimationFrame(madnessFrame);
      madnessFrame = null;
    }
    if (madnessStopTimer !== null) {
      clearTimeout(madnessStopTimer);
      madnessStopTimer = null;
    }
    if (madnessAnchorTimer !== null) {
      clearTimeout(madnessAnchorTimer);
      madnessAnchorTimer = null;
    }
    madnessLevel = 0;
  }

  function joyAnchorIndices() {
    const anchors = [];
    Array.from(textValue).forEach((char, index) => {
      if (char === 'A' || char === 'B' || char === 'C') anchors.push(index);
    });
    return anchors;
  }

  function triggerRandomJoyAnchor() {
    const anchors = joyAnchorIndices();
    if (!anchors.length) return false;
    const visibleAnchors = anchors
      .map((index) => ({ index, pos: findJoyCharPos(index) }))
      .filter(({ pos }) => (
        pos &&
        pos.x >= 20 &&
        pos.x <= STAGE.width - 20 &&
        pos.y >= 20 &&
        pos.y <= STAGE.height - 20
      ));
    if (!visibleAnchors.length) return false;
    const { pos } = visibleAnchors[Math.floor(Math.random() * visibleAnchors.length)];
    triggerMirrorJoy(pos.x, pos.y);
    return true;
  }

  function triggerRedLineMadness(level, persistent = false) {
    stopMadness();
    madnessLevel = level;
    const cycles = persistent ? Infinity : level === 1 ? 1 : level === 2 ? 2 : 3;
    let completed = 0;

    function pulse() {
      triggerRandomJoyAnchor();
      completed += 1;
      if (completed < cycles || persistent) {
        madnessAnchorTimer = setTimeout(pulse, 3300);
      } else {
        madnessAnchorTimer = null;
      }
    }

    pulse();
  }

  async function handleMadnessMilestone() {
    if (answeredCount >= 7 && !triggeredMadnessScores.has(7)) {
      triggeredMadnessScores.add(7);
      triggerRedLineMadness(1);
      await wait(2100);
    }
    if (answeredCount >= 14 && !triggeredMadnessScores.has(14)) {
      triggeredMadnessScores.add(14);
      triggerRedLineMadness(2);
      await typeTextByMachine(` ${AUTO_RULE_TEXT}`);
      await wait(1800);
    }
    if (answeredCount >= 21 && !triggeredMadnessScores.has(21)) {
      triggeredMadnessScores.add(21);
      triggerRedLineMadness(3);
      await wait(700);
    }
  }

  function formatQaEnglish(text = '') {
    return String(text).replace(/[abc]/g, (letter) => letter.toUpperCase());
  }

  function normalizeAlphabetInput(raw = '') {
    return String(raw).replace(/[abc]/gi, (letter) => letter.toUpperCase());
  }

  function getCurrentAlphabetInputPrompt() {
    return ALPHABET_INPUT_PROMPTS[currentPromptIndex] || ALPHABET_INPUT_PROMPTS[0];
  }

  function renderAlphabetInputPrompt() {
    const prompt = getCurrentAlphabetInputPrompt();
    const overlay = document.getElementById('qaOverlay');
    document.getElementById('qaQuestionZh').textContent = prompt.zh;
    document.getElementById('qaQuestionEn').textContent = prompt.en;
    overlay.classList.remove('qa-disabled');
    overlay.style.opacity = '1';
    qaChoicesEl.replaceChildren();
    qaChoicesEl.classList.add('qa-disabled');
  }

  function renderAlphabetInputText(currentText = inputValue) {
    const submittedLines = submittedTexts.map((entry) => entry.normalizedText);
    const lines = currentText ? [...submittedLines, currentText] : submittedLines;
    const nextValue = lines.join(' ');
    updateTextCharacterTimes(textValue, nextValue);
    textValue = nextValue;
    render();
  }

  function updateAlphabetCollectedLetters(value) {
    if (value.includes('A')) abcCollected.A = true;
    if (value.includes('B')) abcCollected.B = true;
    if (value.includes('C')) abcCollected.C = true;
    if (abcCollected.A && abcCollected.B && abcCollected.C && !infectionTriggered) {
      triggerAlphabetInputInfection();
    }
  }

  function submitAlphabetInput() {
    if (!qaEnabled || alphabetInputLocked || openingActive || infectionTriggered) return;
    const prompt = getCurrentAlphabetInputPrompt();
    const normalizedText = normalizeAlphabetInput(inputValue || textInput.value).trim();
    if (!normalizedText) return;
    submittedTexts.push({
      id: `${prompt.id}-${Date.now()}-${submittedTexts.length}`,
      promptId: prompt.id,
      promptZh: prompt.zh,
      promptEn: prompt.en,
      rawText: inputValue || textInput.value,
      normalizedText,
      createdAt: Date.now(),
    });
    inputValue = '';
    textInput.value = '';
    renderAlphabetInputText('');
    updateAlphabetCollectedLetters(normalizedText);
    if (!infectionTriggered) {
      currentPromptIndex = (currentPromptIndex + 1) % ALPHABET_INPUT_PROMPTS.length;
      renderAlphabetInputPrompt();
      applyModeFocus();
    }
  }

  function triggerAlphabetInputInfection() {
    if (infectionTriggered) return;
    infectionTriggered = true;
    alphabetInputLocked = true;
    qaChoiceLocked = true;
    triggerRedLineMadness(4, true);
    textInput.value = textValue;
    typeTextByMachine(` ${AUTO_ALICE_RULE_TEXT}`);
    document.getElementById('qaQuestionZh').textContent = '';
    document.getElementById('qaQuestionEn').textContent = 'Then you already know what comes next.';
    setHintText('正在穿过镜面', 'Passing through the mirror');
    window.setTimeout(() => {
      window.parent.postMessage({ type: 'alphabet:enter-noclipping' }, '*');
    }, 6000);
  }

  function appendBilingual(parent, zhClass, enClass, zh, en, prefix = '', formatEn = false) {
    const normalizedPrefix = String(prefix).replace(/^([abc])(\.|\))/i, (_, letter, mark) => `${letter.toUpperCase()}${mark}`);
    const displayEn = formatEn ? formatQaEnglish(en) : en;
    if (!zh) {
      const enSpan = document.createElement('span');
      enSpan.className = enClass;
      enSpan.textContent = `${normalizedPrefix}${displayEn}`;
      parent.appendChild(enSpan);
      return;
    }
    const zhSpan = document.createElement('span');
    zhSpan.className = zhClass;
    zhSpan.textContent = `${normalizedPrefix}${zh}`;
    parent.appendChild(zhSpan);
    if (en) {
      const separator = document.createElement('span');
      separator.className = enClass;
      separator.textContent = '\u00b7';
      parent.appendChild(separator);
      const enSpan = document.createElement('span');
      enSpan.className = enClass;
      enSpan.textContent = displayEn;
      parent.appendChild(enSpan);
    }
  }

  function getQaQuestion(questionId = currentQuestionId) {
    return alphabetQuestionTree.nodes[questionId] || alphabetQuestionTree.nodes[alphabetQuestionTree.startId];
  }

  function showQaQuestion(questionId = currentQuestionId) {
    currentQuestionId = questionId;
    const q = getQaQuestion(questionId);
    const questionZh = [...(q.prefaceZh || []), q.zh].filter(Boolean).join('\n');
    const questionEn = formatQaEnglish([...(q.prefaceEn || []), q.en].filter(Boolean).join('\n'));
    document.getElementById('qaQuestionZh').textContent = questionZh;
    document.getElementById('qaQuestionEn').textContent = questionEn;
    const overlay = document.getElementById('qaOverlay');
    overlay.classList.remove('qa-disabled');
    overlay.style.opacity = '0';
    qaChoicesEl.classList.remove('qa-disabled');
    qaChoicesEl.replaceChildren();
    requestAnimationFrame(() => {
      overlay.style.opacity = '1';
    });
    const options = Array.isArray(q.options) ? q.options : [];
    options.forEach((choice) => {
      const choiceEl = document.createElement('div');
      choiceEl.className = 'qa-choice';
      const optionPrefix = choice.id ? `${String(choice.id).toUpperCase()}. ` : '\u2192 ';
      appendBilingual(choiceEl, 'qa-choice-zh', 'qa-choice-en', choice.zh, choice.en, optionPrefix, true);
      choiceEl.addEventListener('click', () => handleChoiceSelect(choice));
      qaChoicesEl.appendChild(choiceEl);
      window.setTimeout(() => {
        choiceEl.classList.add('is-visible');
      }, 520 + qaChoicesEl.children.length * 180);
    });
  }

  function transitionToNextQuestion() {
    const overlay = document.getElementById('qaOverlay');
    overlay.style.opacity = '0';
    qaChoicesEl.classList.add('qa-disabled');
    setTimeout(() => { showQaQuestion(currentQuestionId); }, 380);
  }

  async function handleChoiceSelect(choice) {
    if (!qaEnabled || qaChoiceLocked || openingActive) return;
    qaChoiceLocked = true;
    setQaChoicesEnabled(false);
    const question = getQaQuestion();

    if (question.isFinal) {
      await dismissChoices();
      await handleFinalChoice(choice);
      return;
    }

    await dismissChoices();
    await typeTextByMachine(`${formatQaEnglish(choice.en)} `);
    qaAnswerStart = textValue.length;
    answeredCount += 1;
    currentQuestionId = choice.nextId || alphabetQuestionTree.finalId;
    visitedQuestionIds.push(currentQuestionId);
    await handleMadnessMilestone();
    updateProgressBar(answeredCount);
    qaChoiceLocked = false;
    transitionToNextQuestion();
  }

  async function handleFinalChoice(choice) {
    await typeTextByMachine(choice.en || choice.zh);
    updateProgressBar(ALPHABET_QA_MAX_QUESTION_COUNT);
    qaChoicesEl.classList.add('qa-disabled');
    qaFinalResponseEl.classList.add('is-visible');
    if (choice.action === 'go-noclipping') {
      triggerRedLineMadness(4, true);
      typeTextByMachine(` ${AUTO_ALICE_RULE_TEXT}`);
      document.getElementById('qaQuestionZh').textContent = '';
      document.getElementById('qaQuestionEn').textContent = 'Then you already know what comes next.';
      qaFinalResponseEl.replaceChildren();
      qaFinalResponseEl.classList.remove('is-visible');
      setHintText('点击任意处进入下一个画面', 'Click anywhere to enter the next screen');
      finalPendingMessage = { type: 'alphabet:enter-noclipping' };
    } else {
      qaFinalResponseEl.replaceChildren();
      appendBilingual(qaFinalResponseEl, 'qa-final-zh', 'qa-final-en', '欢迎回来。', 'Welcome back.');
      qaFinalResponseEl.classList.add('is-blinking');
      await wait(1300);
      window.parent.postMessage({ type: 'alphabet:return-home' }, '*');
    }
  }

    const hint = document.getElementById('qaHint');
    const token = ++hintSwapToken;
    hint.classList.remove('qa-disabled');
    hint.classList.add('is-swapping');

        card.querySelector('.qa-hint-zh').textContent = zh;
        card.querySelector('.qa-hint-en').textContent = en;

  function setTutorialStep(step) {
    tutorialStep = step;
    if (step === 'move') {
      setHintText('请先拖动红线，移动镜面', 'First, drag the red line to move the mirror');
    } else if (step === 'move-good') {
      setHintText('很好', 'Good');
      window.setTimeout(() => setTutorialStep('rotate'), 4000);
    } else if (step === 'rotate') {
      setHintText('按住 Shift 转动镜面红线', 'Hold Shift to rotate the red mirror line');
    } else if (step === 'good') {
      setHintText('很好', 'Good');
      window.setTimeout(() => setTutorialStep('type'), 4000);

  async function deleteCurrentTextByMachine() {
    clearQaAutoTypingTimer();
    while (textInput.value.length > 0) {
      textInput.value = Array.from(textInput.value).slice(0, -1).join('');
      textInput.dispatchEvent(new Event('input', { bubbles: true }));
      await wait(20 + Math.random() * 35);

  async function beginQuestionSequence() {
    if (!tutorialActive || !tutorialReadyForQuestions) return;
    tutorialActive = false;
    tutorialReadyForQuestions = false;
    document.getElementById('qaHint').classList.add('qa-disabled');
    await deleteCurrentTextByMachine();
    await animateMirrorHome();
    qaEnabled = true;
    initQa();
  }

  function animateMirrorHome() {
    const start = {
      cx: mirror.cx,
      cy: mirror.cy,
      angle: mirror.angle,
    };
    const target = {
      cx: STAGE.width / 2,
      cy: STAGE.height / 2 - 88,
      angle: 0.18,
    };
    const duration = 900;
    const startTime = performance.now();
    return new Promise((resolve) => {
      function tick(now) {
        const raw = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - raw, 3);
        mirror.cx = start.cx + (target.cx - start.cx) * eased;
        mirror.cy = start.cy + (target.cy - start.cy) * eased;
        mirror.angle = start.angle + (target.angle - start.angle) * eased;
        render();
        if (raw < 1) {
          requestAnimationFrame(tick);
        } else {
          resolve();
        }
      }
      requestAnimationFrame(tick);
    });
  }

  // Auto Text — simulates human typing into the text mode
  let autoTextTimer = null;

  function stopAutoText() {
    if (autoTextTimer !== null) {
      clearTimeout(autoTextTimer);
      autoTextTimer = null;
      autoTextStatusEl.textContent = 'Stopped';
    }
  }

  function startAutoText() {
    stopAutoText();

    // Switch to text mode
    if (mode !== 'text') {
      mode = 'text';
      render();
      applyModeFocus();
    }

    // Clear existing text
    textInput.value = '';
    updateTextCharacterTimes(textValue, '');
    textValue = '';
    render();

    const fullText = autoTextContentEl.value;
    if (!fullText) { autoTextStatusEl.textContent = 'Empty'; return; }

    let charIndex = 0;
    autoTextStatusEl.textContent = 'Typing…';

    function typeNextChar() {
      if (charIndex >= fullText.length) {
        autoTextTimer = null;
        autoTextStatusEl.textContent = 'Done';
        return;
      }

      const char = fullText[charIndex];
      textInput.value += char;
      textInput.dispatchEvent(new Event('input', { bubbles: true }));
      charIndex++;

      // Human-like timing
      const prevChar = charIndex > 1 ? fullText[charIndex - 2] : '';
      let delay = 110 + Math.random() * 130;                         // base 110–240 ms
      if (char === ' ')                delay += 40 + Math.random() * 60;
      if ('.,;:!?'.includes(char))     delay += 120 + Math.random() * 180;
      if (char === '-')                delay += 60 + Math.random() * 100;
      if (char === '\n')               delay += 300 + Math.random() * 350;
      if ('.:!?'.includes(prevChar))   delay += 250 + Math.random() * 350; // post-sentence pause
      if (Math.random() < 0.08)        delay *= 0.35;                // burst: occasional fast streak

      autoTextTimer = setTimeout(typeNextChar, delay);
    }

    typeNextChar();
  }
